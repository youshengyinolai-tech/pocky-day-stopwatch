<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="11.11秒チャレンジ">
<title>11.11秒チャレンジ</title>
<meta name="description" content="11月11日はポッキーの日！チョコに隠れたタイマーを、お邪魔に負けずぴったり11.11秒で止めろ。主催：東京理科大学生協学生委員会 神楽坂支部">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #b8141f;
    --red-d: #8f0c15;
    --red-l: #d42a33;
    --cream: #fff1dc;
    --cream-d: #e6d2b3;
    --choco: #4b2317;
    --choco-l: #7a3e27;
    --biscuit: #efc07a;
    --gold: #ffc83a;
    --ink: #2b100a;
    --display: "Dela Gothic One", "Zen Kaku Gothic New", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--red); color: var(--cream);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif; font-weight: 500;
    overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  .app {
    display: grid; height: 100dvh;
    grid-template-columns: minmax(0, 1fr) clamp(290px, 27vw, 380px);
    grid-template-rows: auto minmax(0, 1fr);
  }

  /* ---------- 上部バー ---------- */
  .top {
    grid-column: 1 / -1; display: flex; align-items: center; gap: clamp(10px, 1.8vw, 28px);
    padding: 16px 28px; border-bottom: 2px solid rgba(255,241,220,.18); position: relative; z-index: 8;
  }
  .brand { font-family: var(--display); font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
  .brand b { color: var(--gold); font-weight: 400; }
  .brand small { display: block; font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .14em; opacity: .75; margin-top: 4px; }
  .spacer { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  .ctl > span { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; opacity: .6; margin-right: 6px; }
  .ctl button {
    white-space: nowrap;
    background: none; border: 1.5px solid transparent; border-radius: 999px; padding: 5px 14px;
    cursor: pointer; opacity: .65; font-weight: 700; transition: opacity .15s, border-color .15s;
  }
  .ctl button:hover { opacity: 1; }
  .ctl button[aria-pressed="true"] { opacity: 1; border-color: var(--cream); }
  .ctl button:disabled { cursor: default; }
  .iconbtn {
    white-space: nowrap;
    background: none; border: 1.5px solid rgba(255,241,220,.35); border-radius: 10px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 700;
  }
  .iconbtn:hover { border-color: var(--cream); }

  /* ---------- ステージ ---------- */
  .stage {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; cursor: pointer;
    position: relative; overflow: hidden; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto; padding: 28px 48px 32px;
  }
  .stage::before {
    content: ""; position: absolute; inset: -50%; pointer-events: none;
    background: repeating-linear-gradient(-58deg, transparent 0 70px, rgba(0,0,0,.055) 70px 140px);
  }
  .edge {
    position: absolute; left: 18px; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); transform-origin: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: .5em; opacity: .45; white-space: nowrap; pointer-events: none;
  }
  .stage > * { position: relative; }

  .status {
    text-align: center; font-family: var(--mono); font-size: 13px; letter-spacing: .3em; opacity: .85;
    min-height: 1.5em; transition: opacity .2s;
  }

  .center { display: flex; align-items: center; justify-content: center; gap: clamp(24px, 4vw, 80px); min-height: 0; transition: transform .5s cubic-bezier(.3,1.4,.5,1), filter .4s; }
  .center.j-tilt { transform: rotate(-4deg) scale(.96); }
  .center.j-zoom { transform: scale(1.08); }
  .center.j-blur { filter: blur(6px); }
  .center.j-flip { transform: scaleX(-1); }

  /* スティック：プレッツェルの棒にチョコがコーティングされていく */
  .stick {
    position: relative; width: clamp(14px, 1.2vw, 22px); height: min(52vh, 500px); flex: none;
    filter: drop-shadow(8px 14px 10px rgba(50,0,0,.35)); transition: filter .4s;
  }
  .stick .base, .stick .choco { position: absolute; left: 0; right: 0; bottom: 0; }
  .stick .base, .stick .grip {
    background: linear-gradient(90deg, #b5753a 0%, #dea45d 22%, #f5d09a 40%, #e6b26c 58%, #c2803f 85%, #a3672f 100%);
  }
  .stick .base { height: 100%; border-radius: 999px 999px 3px 3px; }
  .stick .choco {
    height: 20%; border-radius: 999px 999px 3px 3px;
    background: linear-gradient(90deg, #1c0904 0%, #3d180c 18%, #6a3520 33%, #a3694b 41%, #5b2b18 50%, #36150a 75%, #1a0803 100%);
  }
  .stick .choco::after {
    content: ""; position: absolute; left: 33%; width: 12%; top: 2%; bottom: 6%; border-radius: 999px;
    background: linear-gradient(to bottom, rgba(255,232,212,.5), rgba(255,232,212,.1) 55%, transparent);
  }
  .stick.anim .choco { transition: height 1.3s cubic-bezier(.3,.9,.3,1); }
  /* 持ち手：上端をギザっとさせてチョコの付け際に見せる */
  .stick .grip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22%; z-index: 1; border-radius: 0 0 3px 3px;
    clip-path: polygon(0 3%, 18% 1.2%, 40% 4%, 62% 0, 82% 2.6%, 100% 1%, 100% 100%, 0 100%);
  }
  .stick.gold { filter: drop-shadow(0 0 22px var(--gold)) drop-shadow(0 0 6px var(--gold)); }


  /* タイム */
  .screen { position: relative; font-size: min(12vw, 28vh); flex: none; }
  .time {
    font-family: var(--display); font-size: 1em; line-height: 1; display: flex; align-items: baseline;
    text-shadow: 0 .045em 0 var(--red-d);
  }
  .time .d { display: inline-block; width: .88em; text-align: center; }
  .time .dot { display: inline-block; width: .32em; text-align: center; }
  .time .d.rolling { opacity: .55; filter: blur(2px); }
  .time .d.settle { animation: settle .25s ease-out; }
  @keyframes settle { 0% { transform: translateY(-.12em); opacity: .3; } 100% { transform: none; opacity: 1; } }
  .time.perfect { color: var(--gold); animation: perfectPulse .9s ease-in-out 3; }
  @keyframes perfectPulse { 50% { transform: scale(1.06); text-shadow: 0 .045em 0 var(--red-d), 0 0 .3em var(--gold); } }
  /* D判定：がっくり */
  .time.slump .d { animation: slump .8s cubic-bezier(.5,0,.3,1.5) forwards; }
  .time.slump .d:nth-child(2) { animation-delay: .12s; }
  .time.slump .d:nth-child(4) { animation-delay: .24s; }
  .time.slump .d:nth-child(5) { animation-delay: .36s; }
  .time.slump .dot { transition: transform .6s .2s cubic-bezier(.5,0,.3,1.5), opacity .6s .2s; transform: translateY(.1em); opacity: .6; }
  @keyframes slump { to { transform: translateY(var(--y, .06em)) rotate(var(--r, 0deg)); opacity: .62; } }
  .stick { transition: filter .4s, transform 1.4s cubic-bezier(.3,1.6,.5,1); transform-origin: bottom center; }
  .stick.droop.l { transform: rotate(-8deg); }
  .stick.droop.r { transform: rotate(8deg); }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    background: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 35%, rgba(25,0,0,.5));
    transition: opacity 1.2s;
  }
  .stage.down::after { opacity: 1; }
  .stage > .result, .stage > .controls { z-index: 5; }
  .stage.down .center { filter: saturate(.7) brightness(.9); }

  .target {
    position: absolute; left: 0; right: 0; top: 100%; margin-top: .14em; text-align: center;
    font-family: var(--mono); font-size: max(13px, .075em); letter-spacing: .4em; opacity: .7;
  }

  /* チョコのカバー */
  .cover {
    position: absolute; inset: -.06em -.14em .02em; z-index: 3; pointer-events: none;
    border-radius: .14em .14em .04em .04em;
    background:
      radial-gradient(90% 60% at 28% 8%, rgba(255,255,255,.22), transparent 45%),
      linear-gradient(180deg, var(--choco-l) 0%, var(--choco) 38%, #321409 100%);
    box-shadow: 0 .04em .1em rgba(0,0,0,.35);
    transform-origin: top center; transform: scaleY(0); visibility: hidden;
  }
  .cover .drips { position: absolute; left: 0; top: calc(100% - 1px); width: 100%; height: .26em; transform-origin: top; }
  .cover .drips path { fill: #321409; }
  .cover .mini {
    position: absolute; width: .065em; height: .5em; border-radius: 1em; top: -.32em; opacity: 0;
    background: linear-gradient(to top, var(--choco) 0 52%, var(--biscuit) 52%);
    box-shadow: inset -.015em 0 0 rgba(0,0,0,.18);
  }
  .cover .mini.a { right: 14%; rotate: 16deg; }
  .cover .mini.b { left: 18%; rotate: -22deg; height: .42em; top: -.26em; }
  .cover .mini.c { left: 47%; rotate: 4deg; height: .38em; top: -.24em; }
  .cover.on { visibility: visible; animation: pour .55s cubic-bezier(.3,1.4,.5,1) forwards; }
  .cover.on .drips { animation: ooze .9s .35s ease-out both; }
  .cover.on .mini { animation: stab .35s cubic-bezier(.2,1.6,.4,1) both; }
  .cover.on .mini.a { animation-delay: .55s; } .cover.on .mini.b { animation-delay: .7s; } .cover.on .mini.c { animation-delay: .85s; }
  .cover.off { visibility: visible; transform: scaleY(1); animation: lift .35s ease-in forwards; }
  @keyframes pour { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes ooze { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes stab { from { opacity: 0; translate: 0 -.25em; } to { opacity: 1; translate: 0 0; } }
  @keyframes lift { from { transform: scaleY(1); } to { transform: scaleY(0); opacity: .5; } }

  /* 結果 */
  .result { min-height: 150px; display: flex; align-items: center; justify-content: center; gap: 28px; margin: 8px 0 22px; }
  .stamp {
    flex: none; width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-size: 64px; line-height: 1;
    background: var(--bg); color: var(--fg); rotate: -12deg;
    box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 8px var(--fg), 0 10px 0 rgba(0,0,0,.18);
    animation: stamp .45s cubic-bezier(.2,1.6,.4,1);
  }
  .stamp.small { font-size: 30px; }
  @keyframes stamp { 0% { scale: 3; rotate: -40deg; opacity: 0; } 100% { scale: 1; rotate: -12deg; opacity: 1; } }
  .result .txt { animation: fadeUp .4s .15s both; max-width: 460px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .result .label { font-family: var(--display); font-size: 40px; line-height: 1.1; }
  .result .diff { font-family: var(--mono); font-size: 18px; font-weight: 700; margin-top: 6px; opacity: .9; }
  .result .msg { font-size: 15px; margin-top: 6px; opacity: .85; }
  .newbest {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: .1em;
    color: var(--ink); background: var(--gold); border-radius: 4px; padding: 3px 8px; margin-left: 10px; vertical-align: middle;
  }

  /* キーキャップ型ボタン */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .key { background: none; border: 0; padding: 0 0 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; user-select: none; touch-action: manipulation; }
  .key .cap {
    display: flex; align-items: center; justify-content: space-between; width: min(460px, 56vw); height: 68px; padding: 0 22px;
    border-radius: 14px; background: var(--cream); color: var(--ink);
    font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: .35em;
    box-shadow: 0 8px 0 var(--cream-d), 0 14px 24px rgba(0,0,0,.28); transition: transform .06s, box-shadow .06s, background .2s;
  }
  .key .cap em { font-style: normal; font-family: var(--display); letter-spacing: .05em; font-size: 22px; }
  .key.running .cap { background: var(--ink); color: var(--cream); box-shadow: 0 8px 0 #000, 0 14px 24px rgba(0,0,0,.35); }
  .key.pressed .cap, .key:active .cap { transform: translateY(6px); box-shadow: 0 2px 0 var(--cream-d), 0 4px 10px rgba(0,0,0,.25); }
  .key.running.pressed .cap { box-shadow: 0 2px 0 #000; }
  .key.wait { pointer-events: none; opacity: .5; }
  .hint { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; opacity: .6; }

  .cue {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 7;
    font-family: var(--display); font-size: min(18vw, 34vh); color: var(--cream); opacity: 0;
    text-shadow: 0 .05em 0 var(--ink);
  }
  .cue.show { animation: cue .75s ease-out forwards; }
  .cue.small { font-size: min(9vw, 18vh); }
  @keyframes cue { 0% { opacity: 0; scale: 1.8; } 22% { opacity: 1; scale: 1; } 78% { opacity: 1; } 100% { opacity: 0; scale: .92; } }

  .stage.shake { animation: shake .5s; }
  @keyframes shake {
    20% { translate: -10px 3px; } 40% { translate: 8px -3px; } 60% { translate: -6px 2px; } 80% { translate: 4px 0; }
  }

  /* ---------- お邪魔 ---------- */
  .jama { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .j-num {
    position: absolute; font-family: var(--display); color: var(--cream); opacity: 0; white-space: nowrap;
    text-shadow: 0 .05em 0 var(--red-d); animation: jnum 1.3s ease-out forwards;
  }
  @keyframes jnum { 0% { opacity: 0; scale: .6; } 15% { opacity: .95; scale: 1.05; } 70% { opacity: .9; scale: 1; } 100% { opacity: 0; scale: 1.1; } }
  .toasts { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; gap: 10px; width: 320px; }
  .toast {
    background: rgba(255,248,238,.97); color: var(--ink); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 14px 30px rgba(0,0,0,.3); display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px;
    animation: toastIn .35s cubic-bezier(.2,1.3,.4,1), toastOut .3s 2.5s ease-in forwards;
  }
  .toast .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; background: var(--ic, #3ac569); color: #fff; }
  .toast .hd { font-size: 11px; opacity: .6; display: flex; justify-content: space-between; }
  .toast .bd { font-size: 14px; font-weight: 700; line-height: 1.35; }
  @keyframes toastIn { from { translate: 120% 0; } }
  @keyframes toastOut { to { translate: 120% 0; opacity: 0; } }
  @keyframes walk { from { left: -160px; } to { left: calc(100% + 20px); } }
  @keyframes walkRev { from { left: calc(100% + 20px); } to { left: -160px; } }
  .j-fly {
    position: absolute; width: 22px; height: 220px; border-radius: 999px;
    background: linear-gradient(to top, var(--biscuit) 0 22%, var(--choco) 22%);
    animation: fly 1.1s cubic-bezier(.4,.1,.6,.9) forwards;
  }
  @keyframes fly { from { translate: -300px 0; rotate: 0deg; } to { translate: calc(100vw + 300px) var(--dy); rotate: var(--spin); } }
  .j-lie {
    position: absolute; left: 50%; top: 14%; translate: -50% 0; font-family: var(--display); font-size: min(8vw, 15vh);
    color: var(--gold); white-space: nowrap; text-shadow: 0 .06em 0 var(--ink); rotate: -6deg;
    animation: lie .95s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes lie { 0% { opacity: 0; scale: 2.4; } 20% { opacity: 1; scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .j-bubble {
    position: absolute; background: var(--cream); color: var(--ink); font-family: var(--display); font-size: 34px;
    padding: 12px 22px; border-radius: 26px; animation: bubble 1.2s ease-out forwards; white-space: nowrap;
  }
  .j-bubble::after { content: ""; position: absolute; left: 24px; bottom: -14px; border: 9px solid transparent; border-top: 12px solid var(--cream); }
  @keyframes bubble { 0% { opacity: 0; scale: .3; } 18% { opacity: 1; scale: 1.08; } 30% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -16px; } }
  .j-tick { position: absolute; font-family: var(--mono); font-weight: 800; font-size: 20px; letter-spacing: .1em; opacity: 0; animation: tickfx .5s ease-out forwards; }
  @keyframes tickfx { 0% { opacity: .9; scale: 1.3; } 100% { opacity: 0; scale: 1; } }

  .j-cart { position: absolute; bottom: 3%; font-size: 110px; line-height: 1; animation: walk linear forwards; }
  .j-cart span { display: inline-block; animation: rattle .12s ease-in-out infinite alternate; }
  .j-cart.rev { animation-name: walkRev; }
  .j-cart.rev span { transform: scaleX(-1); }
  @keyframes rattle { to { translate: 0 -4px; rotate: 2deg; } }
  .j-rain {
    position: absolute; top: -240px; width: 14px; height: 200px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 40%, rgba(0,0,0,.2)), linear-gradient(to top, var(--biscuit) 0 22%, var(--choco) 22%);
    animation: rainfall linear both;
  }
  @keyframes rainfall { from { transform: translate(0, 0) rotate(0); } to { transform: translate(var(--dx), calc(100vh + 300px)) rotate(var(--rot)); } }
  .j-scan {
    position: absolute; left: 0; right: 0; height: 3px; background: #ff3b3b;
    box-shadow: 0 0 14px 5px rgba(255,50,50,.65); animation: scan .35s ease-out forwards;
  }
  @keyframes scan { from { top: 18%; opacity: 1; } to { top: 82%; opacity: 0; } }
  .j-price {
    position: absolute; background: var(--cream); color: var(--ink); font-family: var(--mono); font-weight: 800;
    font-size: 26px; padding: 6px 14px 8px; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,.25);
    animation: jnum 1s ease-out forwards;
  }
  .j-price small { display: block; font-family: "Zen Kaku Gothic New", sans-serif; font-size: 11px; opacity: .6; }
  .j-receipt {
    position: absolute; top: 0; width: 230px; background: #fffdf7; color: #222; font-family: var(--mono); font-size: 13px;
    padding: 18px 18px 22px; box-shadow: 0 16px 30px rgba(0,0,0,.3); transform-origin: top center;
    animation: printDown 2.2s ease-out forwards;
  }
  .j-receipt b { display: block; text-align: center; font-family: "Zen Kaku Gothic New", sans-serif; font-size: 14px; }
  .j-receipt i { display: block; text-align: center; font-style: normal; font-size: 11px; opacity: .55; margin: 4px 0 10px; }
  .j-receipt div { display: flex; justify-content: space-between; padding: 2px 0; }
  .j-receipt hr { border: 0; border-top: 1.5px dashed #999; margin: 8px 0; }
  @keyframes printDown {
    0% { clip-path: inset(0 0 100% 0); }
    45% { clip-path: inset(0 0 0 0); }
    80% { opacity: 1; transform: none; }
    100% { clip-path: inset(0 0 0 0); opacity: 0; transform: translateY(60px) rotate(6deg); }
  }
  .j-banner {
    position: absolute; left: 0; right: 0; top: 7%; height: 58px; background: #1e7f4f; color: #fff;
    display: flex; align-items: center; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.3);
    animation: bannerIn 3.5s ease forwards;
  }
  .j-banner span {
    display: inline-block; white-space: nowrap; padding-left: 100%; font-weight: 900; font-size: 24px; letter-spacing: .06em;
    animation: marquee 3.5s linear forwards;
  }
  @keyframes marquee { to { transform: translateX(-100%); } }
  @keyframes bannerIn { 0% { opacity: 0; scale: 1 0; } 8%, 92% { opacity: 1; scale: 1 1; } 100% { opacity: 0; scale: 1 0; } }
  .j-shutter {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 2;
    background: repeating-linear-gradient(180deg, #c3c6ca 0 18px, #8e9297 18px 20px, #dde0e3 20px 23px);
    box-shadow: 0 12px 30px rgba(0,0,0,.4); animation: shutter 1.35s cubic-bezier(.5,0,.5,1) forwards;
  }
  .j-shutter b {
    background: #fff; color: #222; border: 3px solid #1e7f4f; padding: 16px 30px; font-size: 26px; font-weight: 900; text-align: center; line-height: 1.5;
  }
  .j-shutter b small { display: block; font-size: 13px; color: #1e7f4f; letter-spacing: .1em; }
  @keyframes shutter { 0% { transform: translateY(-100%); } 30%, 72% { transform: none; } 100% { transform: translateY(-100%); } }

  /* ---------- レシート ---------- */
  .receipt-wrap { padding: 22px 22px 22px 0; min-height: 0; display: flex; position: relative; z-index: 2; }
  .receipt {
    flex: 1; min-height: 0; overflow: auto; background: var(--cream); color: var(--ink);
    font-family: var(--mono); font-size: 13px; padding: 26px 24px 34px; border-radius: 3px 3px 0 0;
    box-shadow: 0 18px 40px rgba(0,0,0,.28);

<script src="defaults.js?v=202611041226"></script>
<script src="firebase-config.js?v=202611041226"></script>
<script>
  const TARGET_CS = 1111; // 11.11秒（センチ秒）
  const MODES = {
    normal: { name: 'ふつう', hideAt: 3, desc: '3秒たつとチョコがタイムを隠す' },
    oni:    { name: '鬼',     hideAt: 0, desc: 'GO! の瞬間からチョコで何も見えない' },
  };
  const JAMA_LEVELS = [
    { name: 'なし', min: 0, max: 0 },
    { name: 'あり', min: 900, max: 2000 },
    { name: '地獄', min: 350, max: 900 },
  ];
  // 判定・お邪魔・表示テキストは defaults.js の初期値を、管理サイト（Firebase）の設定で上書きする
  const CFG_KEY = 'pocky1111-config';
  // 管理画面のプレビュー（admin.html の iframe）として開かれたとき。記録は送らず、何も保存しない
  const PREVIEW = new URLSearchParams(location.search).has('preview');
  let previewing = false;
  let CFG, RANKS;
  function setConfig(raw) {
    CFG = mergePockyConfig(raw);
    // 最後の段階は「それ以外すべて」
    RANKS = CFG.ranks.map((r, i, a) => ({ ...r, max: i === a.length - 1 ? Infinity : r.max, bg: POCKY_RANK_COLORS[r.color].bg, fg: POCKY_RANK_COLORS[r.color].fg }));
    Object.assign(JAMA_LEVELS[1], CFG.jama.normal);
    Object.assign(JAMA_LEVELS[2], CFG.jama.hell);
  }
  // 会場でネットが切れても、最後に受け取った設定で動くように覚えておく
  try { setConfig(JSON.parse(localStorage.getItem(CFG_KEY))); } catch { setConfig(null); }
  let ranking = null, rankStatus = 'オフライン';

  const $ = id => document.getElementById(id);
  const stage = $('stage'), center = $('center'), timeEl = $('time'), btn = $('btn'), btnLabel = $('btnLabel');
  const statusEl = $('status'), resultEl = $('result'), shareBtn = $('share'), cue = $('cue'), cover = $('cover');
  const jamaEl = $('jama'), toastsEl = $('toasts');
  const digits = timeEl.querySelectorAll('.d');
  const sticks = document.querySelectorAll('.stick');
  const chocos = document.querySelectorAll('.choco');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches; // iPad などタッチ端末
  const PRESS = touch ? 'TAP' : 'PRESS SPACE';
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- 保存 ----------
  const KEY = 'pocky1111';
  function load() {
    const d = { best: {}, tries: 0, perfects: 0, history: [], mode: 'normal', jama: 1, sound: true };
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s) {
        Object.assign(d, s);
        if (typeof s.best !== 'object' || s.best === null) d.best = {};
        if (!MODES[d.mode]) d.mode = 'normal';
        if (!JAMA_LEVELS[d.jama]) d.jama = 1;
        d.history = (d.history || []).filter(h => h.g);
      }
    } catch {}
    return d;
  }
  const save = () => { if (PREVIEW) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  let data = load();

  // ---------- サウンド（WebAudioで合成） ----------
  let ac = null, noiseBuf = null;
  function audio() {
    if (!data.sound) return null;
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      } catch { return null; }
    }
    if (ac.state !== 'running') ac.resume().catch(() => {});
    return ac;
  }
  function tone(freq, dur, { type = 'sine', gain = .18, at = 0, to } = {}) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, { gain = .2, at = 0, freq = 3000, q = .8, type = 'bandpass' } = {}) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + at, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  }
  const sfx = {
    ready: () => tone(523, .12, { type: 'triangle' }),
    go:    () => { tone(1046, .25, { type: 'triangle', gain: .22 }); noise(.12, { freq: 6000, gain: .08 }); },
    stop:  () => { noise(.05, { freq: 2500, gain: .3 }); tone(220, .08, { type: 'square', gain: .08 }); },
    roll:  (dur) => { for (let t = 0; t < dur; t += .045) noise(.04, { at: t, freq: 900, q: 1.5, gain: .05 + .15 * (t / dur) }); },
    tick:  () => tone(1400, .04, { type: 'square', gain: .05 }),
    crash: () => noise(1.2, { freq: 7000, type: 'highpass', gain: .18 }),
    perfect: () => {
      [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .5, { type: 'triangle', at: i * .09, gain: .16 }));
      [1046, 1318, 1568].forEach(f => tone(f, 1.4, { type: 'sine', at: .5, gain: .1 }));
      sfx.crash();
    },
    good: () => { tone(880, .3, { type: 'triangle' }); tone(1318, .5, { type: 'triangle', at: .1 }); },
    meh:  () => tone(660, .35, { type: 'triangle', gain: .14 }),
    bad:  () => tone(330, .5, { type: 'sawtooth', gain: .08, to: 160 }),
    flying: () => tone(200, .3, { type: 'square', gain: .1, to: 120 }),
    pour:  () => { tone(180, .35, { type: 'sine', gain: .2, to: 70 }); noise(.3, { freq: 400, q: 1, gain: .12 }); },
    lift:  () => tone(300, .25, { type: 'sine', gain: .12, to: 900 }),
    // お邪魔用
    notify: () => { tone(988, .12, { type: 'sine', gain: .14 }); tone(1319, .2, { type: 'sine', gain: .14, at: .1 }); },
    swoosh: () => noise(.5, { freq: 1200, q: .6, gain: .12 }),
    thud:   () => { tone(90, .3, { type: 'sine', gain: .3, to: 50 }); noise(.08, { freq: 300, gain: .2 }); },
    scan:   () => tone(2900, .09, { type: 'square', gain: .07 }),
    chime:  () => [880, 698, 784, 523].forEach((f, i) => tone(f, .45, { type: 'sine', gain: .16, at: i * .26 })),
    rattle: (dur) => { for (let t = 0; t < dur; t += .07) noise(.04, { at: t, freq: rand(1500, 3200), q: 4, gain: .07 }); },
    shutter: () => { for (let t = 0; t < .4; t += .03) noise(.025, { at: t, freq: 2200, q: 2, gain: .1 }); tone(90, .3, { at: .38, gain: .25, to: 50 }); },
    printer: () => { for (let t = 0; t < .9; t += .05) noise(.04, { at: t, freq: 4200, q: 3, gain: .06 }); },
  };

  // ---------- 表示ヘルパー ----------
  function setDigits(cs) {
    const s = (cs / 100).toFixed(2).padStart(5, '0');
    digits[0].textContent = s[0]; digits[1].textContent = s[1];
    digits[2].textContent = s[3]; digits[3].textContent = s[4];
  }
  function setSticks(cs, animate) {
    const half = TARGET_CS / 2;
    const p1 = Math.min(cs / half, 1), p2 = Math.min(Math.max((cs - half) / half, 0), 1);
    sticks.forEach(s => s.classList.toggle('anim', !!animate));
    chocos[0].style.height = (20 + p1 * 80) + '%';
    chocos[1].style.height = (20 + p2 * 80) + '%';
  }
  function resetSticks() {
    sticks.forEach(s => s.classList.remove('gold', 'droop'));
    stage.classList.remove('down');
    setSticks(0);
  }
  function showCue(text, small) {
    cue.textContent = text;
    cue.classList.toggle('small', !!small);
    cue.classList.remove('show'); void cue.offsetWidth; cue.classList.add('show');
  }
  function bump(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function spawn(cls, html, parent = jamaEl, life = 2000) {
    const el = document.createElement('div');
    el.className = cls; if (html !== undefined) el.innerHTML = html;
    parent.appendChild(el);
    setTimeout(() => el.remove(), life);
    return el;
  }
  function setLabel(t) { btnLabel.textContent = t; }

  // ---------- お邪魔 ----------
  // 隠れている間だけ、ランダムな間隔で発動。どれも本当の経過時間とは無関係。
  // テーマは「生協」と「ポッキー」。
  const POCKY_GRAD = 'linear-gradient(to top, var(--biscuit) 0 22%, var(--choco) 22%)';

  // 種類ごとの細かい設定は管理画面で変えられる（defaults.js の POCKY_JAMA_TYPES）
  const T = k => CFG.jama.types[k];
  const between = r => rand(r.min, r.max);
  const JAMA = {
    fakeTime() {
      const o = T('fakeTime');
      const fake = o.nums.length && Math.random() * 100 < o.near ? pick(o.nums) : between(o.randRange).toFixed(2);
      const el = spawn('j-num', esc(fake), jamaEl, o.life * 1000);
      el.style.left = rand(4, 70) + '%'; el.style.top = rand(8, 70) + '%';
      el.style.fontSize = between(o.size) + 'px'; el.style.rotate = rand(-16, 16) + 'deg';
      el.style.animationDuration = Math.max(.2, o.life - .1) + 's';
      sfx.tick();
    },
    toast() {
      const o = T('toast');
      const { icon, color, app, from, body } = pick(o.items);
      const hd = [app, from].filter(Boolean).map(esc).join(' ・ ');
      const el = spawn('toast', `<div class="ic" style="--ic:${color}">${esc(icon)}</div><div class="hd"><span>${hd}</span><span>今</span></div><div class="bd">${esc(body)}</div>`, toastsEl, o.life * 1000);
      el.style.animationDelay = `0s, ${Math.max(.3, o.life - .4)}s`;
      sfx.notify();
      while (toastsEl.children.length > o.max) toastsEl.firstElementChild.remove();
    },
    // 生協のカートがガラガラ横切る
    cart() {
      if (jamaEl.querySelector('.j-cart')) return;
      const o = T('cart'), dur = between(o.speed);
      const el = spawn('j-cart' + (Math.random() < .5 ? ' rev' : ''), `<span>${esc(o.emoji)}</span>`, jamaEl, dur * 1000 + 100);
      el.style.animationDuration = dur + 's';
      el.style.fontSize = o.size + 'px';
      sfx.rattle(dur);
    },
    // ポッキーが飛んでくる
    flyby() {
      const o = T('flyby');
      const n = Math.random() * 100 < o.many ? o.manyCount : 1;
      for (let i = 0; i < n; i++) {
        const el = spawn('j-fly', '', jamaEl, o.dur * 1000 + i * 120 + 400);
        el.style.top = rand(0, 70) + '%';
        el.style.setProperty('--dy', rand(-200, 200) + 'px');
        el.style.setProperty('--spin', rand(540, 1440) * (Math.random() < .5 ? -1 : 1) + 'deg');
        el.style.animationDuration = o.dur + 's';
        el.style.animationDelay = i * .12 + 's';
      }
      sfx.swoosh();
    },
    // ポッキーの雨
    rain() {
      const o = T('rain');
      const n = data.jama === 2 ? o.hell : o.normal;
      for (let i = 0; i < n; i++) {
        const dur = between(o.speed), delay = rand(0, .5);
        const el = spawn('j-rain', '', jamaEl, (dur + delay) * 1000 + 100);
        el.style.left = rand(-5, 100) + '%';
        el.style.setProperty('--dx', rand(-60, 60) + 'px');
        el.style.setProperty('--rot', rand(-200, 200) + 'deg');
        el.style.animationDuration = dur + 's';
        el.style.animationDelay = delay + 's';
      }
      sfx.swoosh();
    },
    // レジのバーコード音をズレたテンポで鳴らす
    regi() {
      const o = T('regi');
      const interval = between(Math.random() * 100 < o.fastRate ? o.fast : o.slow);
      const n = Math.round(between(o.count));
      for (let i = 0; i < n; i++) {
        jamaTimers.push(setTimeout(() => {
          if (!jamaOn('regi')) return;
          sfx.scan();
          spawn('j-scan', '', jamaEl, 400);
          if (!o.prices.length && !o.item) return;
          const el = spawn('j-price', `${o.item ? `<small>${esc(o.item)}</small>` : ''}${esc(o.prices.length ? pick(o.prices) : '')}`, jamaEl, 1000);
          el.style.left = rand(8, 78) + '%'; el.style.top = rand(12, 72) + '%'; el.style.rotate = rand(-8, 8) + 'deg';
        }, i * interval * 1000));
      }
    },
    // レシートがジジジと印刷されて出てくる
    receipt() {
      const o = T('receipt');
      const qty = Math.round(between(o.qty));
      const rows = Array.from({ length: qty }, () => `<div><span>${esc(o.item)}</span><span>${esc(pick(o.prices))}</span></div>`).join('');
      const el = spawn('j-receipt', `<b>${esc(CFG.texts.store)}</b>${o.date ? `<i>${esc(o.date)}</i>` : ''}${rows}<hr><div><span>合計</span><span>${esc(o.total)}</span></div>${o.footer ? `<i>${esc(o.footer)}</i>` : ''}`, jamaEl, o.life * 1000);
      el.style.left = rand(6, 66) + '%';
      el.style.rotate = rand(-6, 6) + 'deg';
      el.style.animationDuration = Math.max(.3, o.life - .1) + 's';
      sfx.printer();
    },
    // 生協の店内放送
    announce() {
      if (jamaEl.querySelector('.j-banner')) return;
      const o = T('announce');
      const el = spawn('j-banner', `<span>♪ ${esc(pick(o.words))}</span>`, jamaEl, o.life * 1000);
      const d = Math.max(.5, o.life - .1) + 's';
      el.style.animationDuration = d; el.firstElementChild.style.animationDuration = d;
      if (o.chime) sfx.chime();
    },
    // シャッターが下りてくる
    shutter() {
      if (jamaEl.querySelector('.j-shutter')) return;
      const o = T('shutter');
      const el = spawn('j-shutter', `<b>${esc(o.text)}<small>${esc(o.sub || CFG.texts.store)}</small></b>`, jamaEl, o.life * 1000);
      el.style.animationDuration = Math.max(.3, o.life - .05) + 's';
      sfx.shutter();
    },
    lie() {
      const o = T('lie');
      const el = spawn('j-lie', esc(pick(o.words)), jamaEl, o.life * 1000);
      el.style.animationDuration = Math.max(.2, o.life - .05) + 's';
      sfx.thud();
      if (o.shake) bump(stage, 'shake');
    },
    // ポッキーを数える（デタラメな本数）
    count() {
      const o = T('count');
      const el = spawn('j-bubble', esc(`${o.prefix} ${Math.round(between(o.nums))}${o.unit}`.trim()), jamaEl, o.life * 1000);
      el.style.left = rand(8, 66) + '%'; el.style.top = rand(10, 60) + '%';
      el.style.animationDuration = Math.max(.2, o.life - .1) + 's';
      sfx.tick();
    },
    warp() {
      const o = T('warp');
      const c = 'j-' + pick(Object.keys(o.kinds).filter(k => o.kinds[k]));
      center.classList.add(c);
      jamaTimers.push(setTimeout(() => center.classList.remove(c), between(o.dur) * 1000));
    },
    fakeStop() {
      // 止めた音だけ鳴らす
      sfx.stop();
      const o = T('fakeStop');
      if (o.words.length) showCue(pick(o.words), true);
    },
  };
  const JAMA_KEYS = Object.keys(JAMA);
  let jamaActive = false, jamaTimer = 0, jamaTimers = [], lastJama = '';

  function startJama() {
    previewing = false;
    if (!data.jama) return;
    jamaActive = true;
    scheduleJama(rand(300, 900));
  }
  // 出してよい時間帯（GO からの経過）は管理画面で決める。種類ごとの時間帯があればそちらを優先
  const jamaElapsed = () => performance.now() - startAt;
  function inWindow(k, t = jamaElapsed()) {
    if (previewing) return true;
    const o = T(k);
    const from = o.from !== null ? o.from * 1000 : CFG.jama.from;
    // 全体の to は 0 なら「最後まで」。種類ごとの to は書いてある秒数そのまま
    const to = o.to !== null ? o.to * 1000 : CFG.jama.to || Infinity;
    return t >= from && t < to;
  }
  const jamaOn = k => jamaActive && inWindow(k);
  // いま出してよい種類から、出やすさの重みで選ぶ（同じものは続けない）
  function pickJama(keys) {
    const t = jamaElapsed();
    let pool = keys.filter(k => T(k).on && inWindow(k, t));
    if (pool.length > 1) pool = pool.filter(k => k !== lastJama);
    let r = Math.random() * pool.reduce((n, k) => n + CFG.jama.types[k].weight, 0);
    return pool.find(k => (r -= CFG.jama.types[k].weight) < 0);
  }
  function scheduleJama(delay) {
    jamaTimer = setTimeout(() => {
      if (!jamaActive) return;
      const k = pickJama(JAMA_KEYS);
      if (k) {
        lastJama = k;
        JAMA[k]();
        if (data.jama === 2 && Math.random() * 100 < CFG.jama.double) {
          const k2 = pickJama(JAMA_KEYS.filter(x => T(x).pair));
          if (k2) JAMA[k2]();
        }
      }
      const lv = JAMA_LEVELS[data.jama];
      scheduleJama(rand(lv.min, lv.max));
    }, delay);
  }
  function stopJama() {
    jamaActive = false;
    clearTimeout(jamaTimer);
    jamaTimers.forEach(clearTimeout); jamaTimers = [];
    jamaEl.querySelectorAll(':scope > :not(.toasts)').forEach(e => e.remove());
    toastsEl.innerHTML = '';
    center.classList.remove('j-tilt', 'j-zoom', 'j-blur', 'j-flip');
  }

  // ---------- ゲーム状態 ----------
  // idle → ready → running → reveal → done
  let state = 'idle', startAt = 0, raf = 0, readyTimer = 0, lastResult = null, masked = false;

  function setMode(m) {
    data.mode = m; save();
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    renderDesc();
    renderRanking();
  }
  function setJama(j) {
    data.jama = j; save();
    document.querySelectorAll('[data-jama]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.jama === j));
    renderDesc();
  }
  function renderDesc() {
    $('modeDesc').textContent = `${MODES[data.mode].desc} ・ お邪魔${JAMA_LEVELS[data.jama].name} ・ ${touch ? '画面のどこをタップしてもOK' : 'ENTER / クリックでもOK'}`;
  }

  function startReady() {
    state = 'ready';
    resetSticks(); stopJama();
    resultEl.innerHTML = '';
    timeEl.className = 'time'; setDigits(0);
    masked = false; cover.className = 'cover';
    btn.classList.add('running'); setLabel('ストップ');
    statusEl.textContent = 'WAIT FOR GO…';
    lockCtl(true);
    showCue('READY'); sfx.ready();
    readyTimer = setTimeout(go, rand(900, 1700)); // 合図のタイミングをばらす
  }

  function go() {
    state = 'running';
    startAt = performance.now();
    showCue('GO!'); sfx.go();
    statusEl.textContent = 'STOP AT 11.11';
    raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    const cs = Math.max(0, Math.floor((now - startAt) / 10));
    if (cs >= MODES[data.mode].hideAt * 100) {
      if (!masked) {
        // チョコの下の数字は止めておく（すき間から覗けないように）
        masked = true;
        cover.className = 'cover on';
        sfx.pour();
        statusEl.textContent = 'COUNT IN YOUR HEAD';
        startJama();
      }
    } else {
      setDigits(cs);
      setSticks(cs);
    }
    raf = requestAnimationFrame(tick);
  }

  function flying() {
    clearTimeout(readyTimer);
    state = 'done';
    sfx.flying();
    bump(stage, 'shake');
    showCue('フライング', true);
    statusEl.textContent = 'WAIT FOR GO!';
    btn.classList.remove('running'); setLabel('もう一回');
    lockCtl(false);
  }

  function stop(at) {
    cancelAnimationFrame(raf);
    const cs = Math.max(0, Math.floor((at - startAt) / 10));
    state = 'reveal';
    stopJama();
    sfx.stop();
    btn.classList.remove('running'); btn.classList.add('wait'); setLabel('判定中…');
    statusEl.textContent = 'DRUM ROLL…';
    reveal(cs);
  }

  // ドラムロールしながら1桁ずつ確定させる
  function reveal(cs) {
    if (masked) { cover.className = 'cover off'; sfx.lift(); }
    const final = (cs / 100).toFixed(2).padStart(5, '0');
    const finalDigits = [final[0], final[1], final[3], final[4]];
    const ROLL = reduced ? .2 : 1.6;
    const settleAt = [.45, .45, .75, 1].map(x => x * ROLL * 1000);
    const settled = [false, false, false, false];
    sfx.roll(ROLL);
    setSticks(cs, true);

    const t0 = performance.now();
    const iv = setInterval(() => {
      const el = performance.now() - t0;
      digits.forEach((d, i) => {
        if (settled[i]) return;
        if (el >= settleAt[i]) {
          settled[i] = true;
          d.textContent = finalDigits[i];
          d.classList.remove('rolling'); bump(d, 'settle');
          if (i >= 1) sfx.tick();
        } else {
          d.textContent = Math.floor(Math.random() * 10);
          d.classList.add('rolling');
        }
      });
      if (settled.every(Boolean)) {
        clearInterval(iv);
        setTimeout(() => judge(cs), 200);
      }
    }, 50);
  }

  function judge(cs) {
    state = 'done';
    const diff = Math.abs(cs - TARGET_CS);
    const rank = RANKS.find(r => diff <= r.max);
    const shown = (cs / 100).toFixed(2);
    const over = cs > TARGET_CS;
    const prevBest = data.best[data.mode];
    const isBest = prevBest === undefined || diff < prevBest;

    let msg;
    if (diff === 0) msg = '完璧な 11.11 秒。あなたがポッキーの日の主役です';
    else if (diff <= 5) msg = over ? 'ほんの一瞬だけ遅かった…！' : 'ほんの一瞬だけ早かった…！';
    else if (diff <= 50) msg = over ? 'ちょっと遅め。もう少し早く！' : 'ちょっと早め。もう少しガマン！';
    else msg = over ? '待ちすぎ！次はもっと早めに' : '焦りすぎ！次はもっとガマン';

    resultEl.innerHTML = `
      <div class="stamp ${rank.max === 0 || rank.g.length > 1 ? 'small' : ''}" style="--bg:${rank.bg};--fg:${rank.fg}">${rank.max === 0 ? '11.11' : esc(rank.g)}</div>
      <div class="txt">
        <div class="label">${esc(rank.label)}${isBest ? '<span class="newbest">NEW BEST</span>' : ''}</div>
        <div class="diff">誤差 ${diff === 0 ? '±0.00' : (over ? '+' : '−') + (diff / 100).toFixed(2)} 秒 ・ ${MODES[data.mode].name} ・ お邪魔${JAMA_LEVELS[data.jama].name}</div>
        <div class="msg">${msg}</div>
      </div>`;

    EFFECTS[rank.effect]();

    data.tries++;
    if (diff === 0) data.perfects++;
    if (isBest) data.best[data.mode] = diff;
    data.history.unshift({ n: data.tries, t: shown, diff, g: rank.g, m: data.mode, j: data.jama });
    data.history = data.history.slice(0, 12);
    save();
    renderStats();
    Pocky.submit({ cs, diff, g: rank.g, mode: data.mode, jama: data.jama });

    lastResult = { shown, diff, g: rank.g, mode: data.mode, jama: data.jama };
    shareBtn.disabled = false;
    statusEl.textContent = diff === 0 ? '★ ★ ★ PERFECT ★ ★ ★' : `${PRESS} TO RETRY`;
    btn.classList.remove('wait'); setLabel('もう一回');
    lockCtl(false);
  }

  // 判定ごとの演出（管理画面で段階ごとに選べる）
  const EFFECTS = {
    perfect() {
      timeEl.classList.add('perfect');
      sticks.forEach(s => s.classList.add('gold'));
      sfx.perfect(); flash(); rain(120);
    },
    great() { sticks.forEach(s => s.classList.add('gold')); sfx.good(); rain(45); },
    good() { sfx.good(); rain(18); },
    meh() { sfx.meh(); },
    bad() { sfx.bad(); slump(); },
  };

  // がっくり：数字がずり落ち、ポッキーがしなだれ、照明が落ちる
  function slump() {
    setTimeout(() => {
      digits.forEach(d => {
        d.style.setProperty('--r', rand(-10, 10).toFixed(1) + 'deg');
        d.style.setProperty('--y', rand(.04, .1).toFixed(3) + 'em');
      });
      timeEl.classList.add('slump');
      sticks.forEach(s => s.classList.add('droop'));
      stage.classList.add('down');
    }, 250);
  }

  function flash() {
    if (reduced) return;
    const f = document.createElement('div'); f.className = 'flash';
    document.body.appendChild(f); setTimeout(() => f.remove(), 800);
  }

  function rain(n) {
    if (reduced) return;
    const colors = ['var(--choco)', '#f49ab0', '#7cc28a', '#ffffff', '#c9a0dc', 'var(--gold)'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'fall';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.setProperty('--cc', colors[i % colors.length]);
      c.style.setProperty('--dx', rand(-80, 80) + 'px');
      c.style.setProperty('--rot', rand(-500, 500) + 'deg');
      c.style.animationDuration = rand(1.8, 3.8) + 's';
      c.style.animationDelay = Math.random() * .7 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function lockCtl(lock) { document.querySelectorAll('[data-mode], [data-jama]').forEach(b => b.disabled = lock); }

  function renderStats() {
    const fmt = v => v === undefined ? '--' : (v / 100).toFixed(2) + 's';
    $('bestNormal').textContent = fmt(data.best.normal);
    $('bestOni').textContent = fmt(data.best.oni);
    $('tries').textContent = data.tries;
    $('perfects').textContent = data.perfects;
    $('history').innerHTML = data.history.length
      ? data.history.map(h => {
          const r = RANKS.find(r => r.g === h.g) || RANKS.find(r => h.diff <= r.max);
          const no = h.n ? String(h.n).padStart(3, '0') : '---';
          const tag = (MODES[h.m] ? MODES[h.m].name : '') + (h.j === 2 ? '・地獄' : h.j === 0 ? '・素' : '');
          return `<li><span class="no">${no}</span><span class="t">${h.t}s<small>${tag}</small></span><span class="g" style="--bg:${r.bg};--fg:${r.fg}">${esc(h.g)}</span><span class="e">±${(h.diff / 100).toFixed(2)}</span></li>`;
        }).join('')
      : '<li class="empty">まだ記録がありません</li>';
  }

  // 全体ランキング（Firebase）。判定はいまの設定で付け直す
  function renderRanking() {
    $('rankMode').textContent = MODES[data.mode].name;
    $('rankState').textContent = rankStatus;
    $('rankState').classList.toggle('on', rankStatus === 'LIVE');
    const list = (ranking || []).filter(s => s.mode === data.mode).sort((a, b) => a.diff - b.diff || a.at - b.at).slice(0, 5);
    $('ranking').innerHTML = list.length
      ? list.map((s, i) => {
          const r = RANKS.find(r => s.diff <= r.max);
          const tag = s.jama === 2 ? '地獄' : s.jama === 0 ? '素' : '';
          return `<li><span class="no">${i + 1}位</span><span class="t">${(s.cs / 100).toFixed(2)}s<small>${tag}</small></span><span class="g" style="--bg:${r.bg};--fg:${r.fg}">${esc(r.g)}</span><span class="e">±${(s.diff / 100).toFixed(2)}</span></li>`;
        }).join('')
      : `<li class="empty">${ranking ? 'まだ記録がありません' : '接続するとここに出ます'}</li>`;
  }

  function applyTexts() {
    const t = CFG.texts;
    $('brand').innerHTML = esc(t.title).replace('11.11', '<b>11.11</b>') + `<small>${esc(t.store + t.org)}</small>`;
    $('store').innerHTML = `${esc(t.store)}<br>${esc(t.org)}`;
    $('thanks').innerHTML = `THANK YOU FOR PLAYING<br>主催<br>${esc(t.store)}<br>${esc(t.org)}`;
    $('notice').textContent = t.notice;
    $('notice').hidden = !t.notice;
  }

  // sync.js（Firebase）から呼ばれる窓口。つながらなければ submit は何もしない
  window.Pocky = {
    preview: PREVIEW,
    applyConfig(raw) {
      try { localStorage.setItem(CFG_KEY, JSON.stringify(raw)); } catch {}
      setConfig(raw);
      applyTexts(); renderDesc(); renderStats(); renderRanking();
    },
    setRanking(list, status) { ranking = list; rankStatus = status; renderRanking(); },
    submit() {},
  };

  // 管理画面からのプレビュー指示：まだ保存していない設定を当てて、指定のお邪魔を出す
  if (PREVIEW) addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.pocky !== 'preview') return;
    const { config, jama } = e.data;
    if (config) {
      setConfig(config);
      applyTexts(); renderDesc(); renderStats(); renderRanking();
    }
    if (jama && JAMA[jama]) {
      // 遊んでいる途中ならそのまま重ねる。止まっているときは画面を片付けてから出す
      if (state !== 'running') {
        stopJama();
        previewing = true; jamaActive = true;
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => { if (state !== 'running') { jamaActive = false; previewing = false; } }, 15000);
      }
      JAMA[jama]();
    }
  });
  let previewTimer = 0;

  // ---------- 入力 ----------
  function action(at) {
    if (state === 'idle' || state === 'done') startReady();
    else if (state === 'ready') flying();
    else if (state === 'running') stop(at);
  }
  function pressFx() { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 110); }

  // pointerdown で押した瞬間の時刻を使う（クリックより反応が速い）
  // ステージ上ならどこを押してもOK（iPadで押しやすいように）
  // timeStamp の基準がブラウザによって違う場合に備えて、ずれていたら現在時刻を使う
  const stampOf = e => Math.abs(e.timeStamp - performance.now()) < 1000 ? e.timeStamp : performance.now();
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !e.isPrimary) return;
    e.preventDefault();
    pressFx();
    action(stampOf(e));
  });
  btn.addEventListener('click', e => e.preventDefault());
  stage.addEventListener('contextmenu', e => e.preventDefault());
  // iOS はタップの中でしか音を解禁できないので、操作のたびに止まっていないか確かめる
  // マナーモードでも効果音が鳴るように、メディア再生として扱わせる（iOS 17 以降）
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  // それより古い iOS 向け：無音の <audio> を一度再生しておくとマナーモードでも鳴る
  const SILENT_WAV = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
  let silent = null;
  function unlockAudio() {
    if (!audio()) return;
    if (!silent) { silent = new Audio(SILENT_WAV); silent.play().catch(() => {}); }
  }
  ['touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlockAudio, { capture: true }));
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
      if (e.target.closest && e.target.closest('.top, .receipt')) return;
      e.preventDefault();
      pressFx();
      action(stampOf(e));
    } else if (e.code === 'KeyF' && !e.repeat) {
      toggleFs();
    }
  });

  function toggleFs() {
    try {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch {}
  }
  $('fsBtn').addEventListener('click', e => { toggleFs(); e.currentTarget.blur(); });

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); b.blur(); }));
  document.querySelectorAll('[data-jama]').forEach(b => b.addEventListener('click', () => { setJama(+b.dataset.jama); b.blur(); }));

  const soundBtn = $('sound');
  const renderSound = () => soundBtn.textContent = data.sound ? 'SOUND ON' : 'SOUND OFF';
  soundBtn.addEventListener('click', () => { data.sound = !data.sound; save(); renderSound(); soundBtn.blur(); });

  shareBtn.addEventListener('click', () => {
    if (!lastResult) return;
    const r = lastResult;
    const head = r.diff === 0 ? '【PERFECT】ぴったり11.11秒で止めた！' : `11.11秒チャレンジ ランク${r.g}`;
    const text = `${head}\n記録 ${r.shown} 秒（誤差 ${(r.diff / 100).toFixed(2)} 秒）／${MODES[r.mode].name}・お邪魔${JAMA_LEVELS[r.jama].name}\n主催：${CFG.texts.store}${CFG.texts.org}\n#ポッキーの日 #1111`;
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(location.href), '_blank');
  });

  statusEl.textContent = `${PRESS} TO START`;
  if (touch) $('capKey').textContent = 'TAP';
  applyTexts();
  setMode(data.mode);
  setJama(data.jama);
  renderSound();
  renderStats();
  resetSticks();
