<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11.11秒チャレンジ</title>
<meta name="description" content="11月11日はポッキーの日！チョコに隠れたタイマーを、お邪魔に負けずぴったり11.11秒で止めろ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #b8141f;
    --red-d: #8f0c15;
    --red-l: #d42a33;
    --cream: #fff1dc;
    --cream-d: #e6d2b3;
    --choco: #4b2317;
    --choco-l: #7a3e27;
    --biscuit: #efc07a;
    --gold: #ffc83a;
    --ink: #2b100a;
    --display: "Dela Gothic One", "Zen Kaku Gothic New", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--red); color: var(--cream);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif; font-weight: 500;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .app {
    display: grid; height: 100dvh;
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-rows: auto minmax(0, 1fr);
  }

  /* ---------- 上部バー ---------- */
  .top {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 28px;
    padding: 16px 28px; border-bottom: 2px solid rgba(255,241,220,.18); position: relative; z-index: 8;
  }
  .brand { font-family: var(--display); font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
  .brand b { color: var(--gold); font-weight: 400; }
  .brand small { font-family: var(--mono); font-size: 11px; letter-spacing: .25em; opacity: .7; margin-left: 10px; }
  .spacer { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  .ctl > span { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; opacity: .6; margin-right: 6px; }
  .ctl button {
    background: none; border: 1.5px solid transparent; border-radius: 999px; padding: 5px 14px;
    cursor: pointer; opacity: .65; font-weight: 700; transition: opacity .15s, border-color .15s;
  }
  .ctl button:hover { opacity: 1; }
  .ctl button[aria-pressed="true"] { opacity: 1; border-color: var(--cream); }
  .ctl button:disabled { cursor: default; }
  .iconbtn {
    background: none; border: 1.5px solid rgba(255,241,220,.35); border-radius: 10px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 700;
  }
  .iconbtn:hover { border-color: var(--cream); }

  /* ---------- ステージ ---------- */
  .stage {
    position: relative; overflow: hidden; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto; padding: 28px 48px 32px;
  }
  .stage::before {
    content: ""; position: absolute; inset: -50%; pointer-events: none;
    background: repeating-linear-gradient(-58deg, transparent 0 70px, rgba(0,0,0,.055) 70px 140px);
  }
  .edge {
    position: absolute; left: 18px; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); transform-origin: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: .5em; opacity: .45; white-space: nowrap; pointer-events: none;
  }
  .stage > * { position: relative; }
  .stage.blackout .center, .stage.blackout .status { opacity: 0; transition: opacity .05s; }
  .blackout-veil {
    position: absolute; inset: 0; background: #0b0302; z-index: 6; display: grid; place-items: center;
    font-family: var(--mono); letter-spacing: .4em; font-size: 14px; color: rgba(255,241,220,.5);
    animation: veil .9s ease-out forwards; pointer-events: none;
  }
  @keyframes veil { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

  .status {
    text-align: center; font-family: var(--mono); font-size: 13px; letter-spacing: .3em; opacity: .85;
    min-height: 1.5em; transition: opacity .2s;
  }

  .center { display: flex; align-items: center; justify-content: center; gap: clamp(24px, 4vw, 80px); min-height: 0; transition: transform .5s cubic-bezier(.3,1.4,.5,1), filter .4s; }
  .center.j-tilt { transform: rotate(-4deg) scale(.96); }
  .center.j-zoom { transform: scale(1.08); }
  .center.j-blur { filter: blur(6px); }
  .center.j-flip { transform: scaleX(-1); }

  /* スティック */
  .stick { position: relative; width: clamp(26px, 3.2vw, 54px); height: min(50vh, 480px); flex: none; }
  .stick .base, .stick .choco { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; }
  .stick .base { height: 100%; background: rgba(0,0,0,.18); box-shadow: inset 0 0 0 1.5px rgba(255,241,220,.12); }
  .stick .choco {
    height: 22%;
    background: linear-gradient(90deg, var(--choco), var(--choco-l) 38%, #9a5636 46%, var(--choco) 78%);
  }
  .stick.anim .choco { transition: height 1.3s cubic-bezier(.3,.9,.3,1); }
  .stick .grip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22%; z-index: 1; border-radius: 0 0 999px 999px;
    background: repeating-linear-gradient(0deg, var(--biscuit) 0 10px, #d9a35e 10px 11px);
  }
  .stick.gold { filter: drop-shadow(0 0 22px var(--gold)) drop-shadow(0 0 6px var(--gold)); }
  .stick.snapped .base, .stick.snapped .choco { clip-path: inset(30% 0 0 0); }
  .stick.wobble { animation: wobble 1.6s ease-in-out infinite; transform-origin: bottom center; }
  .stick.wobble.r { animation-delay: -.8s; }
  @keyframes wobble { 50% { transform: rotate(2.5deg); } }
  .piece {
    position: absolute; left: 0; top: 0; width: 100%; height: 30%; border-radius: 999px; z-index: 2;
    background: linear-gradient(90deg, var(--choco), var(--choco-l) 38%, #9a5636 46%, var(--choco) 78%);
    animation: piece 1.2s cubic-bezier(.5,0,.8,.6) forwards;
  }
  @keyframes piece {
    25% { transform: translate(18px,-24px) rotate(35deg); }
    100% { transform: translate(110px, 70vh) rotate(260deg); opacity: 0; }
  }
  .pokit {
    position: absolute; top: 4%; left: 120%; font-family: var(--display); font-size: clamp(28px, 3vw, 48px);
    color: var(--gold); white-space: nowrap; transform: rotate(-12deg); pointer-events: none; z-index: 3;
    animation: pokit 1s ease-out forwards; text-shadow: 0 4px 0 var(--ink);
  }
  @keyframes pokit { 0% { opacity: 0; scale: .4; } 30% { opacity: 1; scale: 1.2; } 100% { opacity: 0; scale: 1; translate: 10px -40px; } }

  /* タイム */
  .screen { position: relative; font-size: min(12vw, 28vh); flex: none; }
  .time {
    font-family: var(--display); font-size: 1em; line-height: 1; display: flex; align-items: baseline;
    text-shadow: 0 .045em 0 var(--red-d);
  }
  .time .d { display: inline-block; width: .88em; text-align: center; }
  .time .dot { display: inline-block; width: .32em; text-align: center; }
  .time .d.rolling { opacity: .55; filter: blur(2px); }
  .time .d.settle { animation: settle .25s ease-out; }
  @keyframes settle { 0% { transform: translateY(-.12em); opacity: .3; } 100% { transform: none; opacity: 1; } }
  .time.perfect { color: var(--gold); animation: perfectPulse .9s ease-in-out 3; }
  @keyframes perfectPulse { 50% { transform: scale(1.06); text-shadow: 0 .045em 0 var(--red-d), 0 0 .3em var(--gold); } }
  .target {
    position: absolute; left: 0; right: 0; top: 100%; margin-top: .14em; text-align: center;
    font-family: var(--mono); font-size: max(13px, .075em); letter-spacing: .4em; opacity: .7;
  }

  /* チョコのカバー */
  .cover {
    position: absolute; inset: -.06em -.14em .02em; z-index: 3; pointer-events: none;
    border-radius: .14em .14em .04em .04em;
    background:
      radial-gradient(90% 60% at 28% 8%, rgba(255,255,255,.22), transparent 45%),
      linear-gradient(180deg, var(--choco-l) 0%, var(--choco) 38%, #321409 100%);
    box-shadow: 0 .04em .1em rgba(0,0,0,.35);
    transform-origin: top center; transform: scaleY(0); visibility: hidden;
  }
  .cover .drips { position: absolute; left: 0; top: calc(100% - 1px); width: 100%; height: .26em; transform-origin: top; }
  .cover .drips path { fill: #321409; }
  .cover .mini {
    position: absolute; width: .065em; height: .5em; border-radius: 1em; top: -.32em; opacity: 0;
    background: linear-gradient(to top, var(--choco) 0 52%, var(--biscuit) 52%);
    box-shadow: inset -.015em 0 0 rgba(0,0,0,.18);
  }
  .cover .mini.a { right: 14%; rotate: 16deg; }
  .cover .mini.b { left: 18%; rotate: -22deg; height: .42em; top: -.26em; }
  .cover .mini.c { left: 47%; rotate: 4deg; height: .38em; top: -.24em; }
  .cover.on { visibility: visible; animation: pour .55s cubic-bezier(.3,1.4,.5,1) forwards; }
  .cover.on .drips { animation: ooze .9s .35s ease-out both; }
  .cover.on .mini { animation: stab .35s cubic-bezier(.2,1.6,.4,1) both; }
  .cover.on .mini.a { animation-delay: .55s; } .cover.on .mini.b { animation-delay: .7s; } .cover.on .mini.c { animation-delay: .85s; }
  .cover.off { visibility: visible; transform: scaleY(1); animation: lift .35s ease-in forwards; }
  @keyframes pour { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes ooze { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes stab { from { opacity: 0; translate: 0 -.25em; } to { opacity: 1; translate: 0 0; } }
  @keyframes lift { from { transform: scaleY(1); } to { transform: scaleY(0); opacity: .5; } }

  /* 結果 */
  .result { min-height: 150px; display: flex; align-items: center; justify-content: center; gap: 28px; margin: 8px 0 22px; }
  .stamp {
    flex: none; width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-size: 64px; line-height: 1;
    background: var(--bg); color: var(--fg); rotate: -12deg;
    box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 8px var(--fg), 0 10px 0 rgba(0,0,0,.18);
    animation: stamp .45s cubic-bezier(.2,1.6,.4,1);
  }
  .stamp.small { font-size: 30px; }
  @keyframes stamp { 0% { scale: 3; rotate: -40deg; opacity: 0; } 100% { scale: 1; rotate: -12deg; opacity: 1; } }
  .result .txt { animation: fadeUp .4s .15s both; max-width: 460px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .result .label { font-family: var(--display); font-size: 40px; line-height: 1.1; }
  .result .diff { font-family: var(--mono); font-size: 18px; font-weight: 700; margin-top: 6px; opacity: .9; }
  .result .msg { font-size: 15px; margin-top: 6px; opacity: .85; }
  .newbest {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: .1em;
    color: var(--ink); background: var(--gold); border-radius: 4px; padding: 3px 8px; margin-left: 10px; vertical-align: middle;
  }

  /* キーキャップ型ボタン */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .key { background: none; border: 0; padding: 0 0 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; user-select: none; touch-action: manipulation; }
  .key .cap {
    display: flex; align-items: center; justify-content: space-between; width: min(460px, 56vw); height: 68px; padding: 0 22px;
    border-radius: 14px; background: var(--cream); color: var(--ink);
    font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: .35em;
    box-shadow: 0 8px 0 var(--cream-d), 0 14px 24px rgba(0,0,0,.28); transition: transform .06s, box-shadow .06s, background .2s;
  }
  .key .cap em { font-style: normal; font-family: var(--display); letter-spacing: .05em; font-size: 22px; }
  .key.running .cap { background: var(--ink); color: var(--cream); box-shadow: 0 8px 0 #000, 0 14px 24px rgba(0,0,0,.35); }
  .key.pressed .cap, .key:active .cap { transform: translateY(6px); box-shadow: 0 2px 0 var(--cream-d), 0 4px 10px rgba(0,0,0,.25); }
  .key.running.pressed .cap { box-shadow: 0 2px 0 #000; }
  .key.wait { pointer-events: none; opacity: .5; }
  .hint { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; opacity: .6; }

  .cue {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 7;
    font-family: var(--display); font-size: min(18vw, 34vh); color: var(--cream); opacity: 0;
    text-shadow: 0 .05em 0 var(--ink);
  }
  .cue.show { animation: cue .75s ease-out forwards; }
  .cue.small { font-size: min(9vw, 18vh); }
  @keyframes cue { 0% { opacity: 0; scale: 1.8; } 22% { opacity: 1; scale: 1; } 78% { opacity: 1; } 100% { opacity: 0; scale: .92; } }

  .stage.shake { animation: shake .5s; }
  @keyframes shake {
    20% { translate: -10px 3px; } 40% { translate: 8px -3px; } 60% { translate: -6px 2px; } 80% { translate: 4px 0; }
  }

  /* ---------- お邪魔 ---------- */
  .jama { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .j-num {
    position: absolute; font-family: var(--display); color: var(--cream); opacity: 0; white-space: nowrap;
    text-shadow: 0 .05em 0 var(--red-d); animation: jnum 1.3s ease-out forwards;
  }
  @keyframes jnum { 0% { opacity: 0; scale: .6; } 15% { opacity: .95; scale: 1.05; } 70% { opacity: .9; scale: 1; } 100% { opacity: 0; scale: 1.1; } }
  .toasts { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; gap: 10px; width: 320px; }
  .toast {
    background: rgba(255,248,238,.97); color: var(--ink); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 14px 30px rgba(0,0,0,.3); display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px;
    animation: toastIn .35s cubic-bezier(.2,1.3,.4,1), toastOut .3s 2.5s ease-in forwards;
  }
  .toast .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; background: var(--ic, #3ac569); color: #fff; }
  .toast .hd { font-size: 11px; opacity: .6; display: flex; justify-content: space-between; }
  .toast .bd { font-size: 14px; font-weight: 700; line-height: 1.35; }
  @keyframes toastIn { from { translate: 120% 0; } }
  @keyframes toastOut { to { translate: 120% 0; opacity: 0; } }
  .j-cat { position: absolute; bottom: 4%; font-size: 92px; line-height: 1; animation: walk 3.4s linear forwards; }
  .j-cat span { display: inline-block; animation: bob .35s ease-in-out infinite alternate; }
  .j-cat.rev span { transform: scaleX(-1); }
  @keyframes walk { from { left: -120px; } to { left: calc(100% + 20px); } }
  .j-cat.rev { animation-name: walkRev; }
  @keyframes walkRev { from { left: calc(100% + 20px); } to { left: -120px; } }
  @keyframes bob { to { translate: 0 -8px; } }
  .j-fly {
    position: absolute; width: 22px; height: 220px; border-radius: 999px;
    background: linear-gradient(to top, var(--biscuit) 0 22%, var(--choco) 22%);
    animation: fly 1.1s cubic-bezier(.4,.1,.6,.9) forwards;
  }
  @keyframes fly { from { translate: -300px 0; rotate: 0deg; } to { translate: calc(100vw + 300px) var(--dy); rotate: var(--spin); } }
  .j-lie {
    position: absolute; left: 50%; top: 14%; translate: -50% 0; font-family: var(--display); font-size: min(8vw, 15vh);
    color: var(--gold); white-space: nowrap; text-shadow: 0 .06em 0 var(--ink); rotate: -6deg;
    animation: lie .95s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes lie { 0% { opacity: 0; scale: 2.4; } 20% { opacity: 1; scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .j-bubble {
    position: absolute; background: var(--cream); color: var(--ink); font-family: var(--display); font-size: 34px;
    padding: 12px 22px; border-radius: 26px; animation: bubble 1.2s ease-out forwards; white-space: nowrap;
  }
  .j-bubble::after { content: ""; position: absolute; left: 24px; bottom: -14px; border: 9px solid transparent; border-top: 12px solid var(--cream); }
  @keyframes bubble { 0% { opacity: 0; scale: .3; } 18% { opacity: 1; scale: 1.08; } 30% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -16px; } }
  .j-tick { position: absolute; font-family: var(--mono); font-weight: 800; font-size: 20px; letter-spacing: .1em; opacity: 0; animation: tickfx .5s ease-out forwards; }
  @keyframes tickfx { 0% { opacity: .9; scale: 1.3; } 100% { opacity: 0; scale: 1; } }

  /* ---------- レシート ---------- */
  .receipt-wrap { padding: 22px 22px 22px 0; min-height: 0; display: flex; position: relative; z-index: 2; }
  .receipt {
    flex: 1; min-height: 0; overflow: auto; background: var(--cream); color: var(--ink);
    font-family: var(--mono); font-size: 13px; padding: 26px 24px 34px; border-radius: 3px 3px 0 0;
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 51% repeat-x,
                  linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat;
            mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 51% repeat-x,
                  linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat;
    scrollbar-width: thin;
  }
  .receipt h2 { font-family: var(--display); font-weight: 400; font-size: 22px; text-align: center; margin: 0; letter-spacing: .02em; }
  .receipt .sub { text-align: center; font-size: 11px; letter-spacing: .3em; opacity: .6; margin-top: 6px; }
  .rule { border: 0; border-top: 1.5px dashed rgba(43,16,10,.35); margin: 16px 0; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row b { font-weight: 800; }
  .row.big { font-size: 15px; }
  .row.big b { font-size: 20px; }
  .rh { font-size: 10px; letter-spacing: .3em; opacity: .55; margin-bottom: 8px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 34px 1fr 26px 62px; gap: 6px; padding: 5px 0; align-items: center; }
  .log li .no { opacity: .5; }
  .log li .g { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--bg); color: var(--fg); }
  .log li .e { text-align: right; opacity: .7; }
  .log li .t small { opacity: .5; font-size: 10px; margin-left: 4px; }
  .log li.empty { display: block; opacity: .5; text-align: center; padding: 10px 0; }
  .share {
    display: block; width: 100%; margin-top: 18px; padding: 12px; border-radius: 8px; border: 1.5px solid var(--ink);
    background: none; color: var(--ink); font-family: var(--mono); font-weight: 700; letter-spacing: .15em; cursor: pointer;
  }
  .share:hover:not(:disabled) { background: var(--ink); color: var(--cream); }
  .share:disabled { opacity: .3; cursor: default; }
  .thanks { text-align: center; font-size: 11px; letter-spacing: .25em; opacity: .55; margin-top: 18px; line-height: 1.8; }
  .barcode { height: 38px; margin: 14px auto 0; width: 70%; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px); opacity: .85; }

  /* 紙吹雪 */
  .fall {
    position: fixed; top: -60px; width: 9px; height: 52px; border-radius: 5px; pointer-events: none; z-index: 20;
    background: linear-gradient(to top, var(--biscuit) 0 24%, var(--cc) 24%);
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translate(var(--dx), 115vh) rotate(var(--rot)); } }
  .flash { position: fixed; inset: 0; background: var(--gold); pointer-events: none; z-index: 19; animation: flash .7s ease-out forwards; }
  @keyframes flash { from { opacity: .6; } to { opacity: 0; } }

  /* 狭い画面（スマホ等）では縦積み */
  @media (max-width: 960px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .top { flex-wrap: wrap; gap: 10px 18px; padding: 14px 16px; }
    .spacer { display: none; }
    .stage { min-height: calc(100dvh - 110px); padding: 20px 16px 28px; }
    .edge { display: none; }
    .screen { font-size: min(19vw, 26vh); }
    .stick { height: 36vh; }
    .result { flex-direction: column; text-align: center; gap: 14px; }
    .result .label { font-size: 30px; }
    .key .cap { width: min(460px, 86vw); }
    .receipt-wrap { padding: 0 16px 24px; }
    .toasts { width: min(300px, calc(100% - 36px)); }
    #fsBtn { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .fall, .flash, .piece { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">ポッキーの日 <b>11.11</b>秒チャレンジ<small>NOV.11</small></div>
    <div class="spacer"></div>
    <div class="ctl" role="group" aria-label="難易度">
      <span>MODE</span>
      <button data-mode="normal" aria-pressed="true">ふつう</button>
      <button data-mode="oni" aria-pressed="false">鬼</button>
    </div>

  <main class="stage" id="stage">

          <i class="mini a"></i><i class="mini b"></i><i class="mini c"></i>
          <svg class="drips" viewBox="0 0 300 40" preserveAspectRatio="none">
            <path d="M0,0 H300 V4 C292,4 290,8 290,14 V26 C290,34 274,34 274,26 V14 C274,8 268,4 260,4 H205 C197,4 194,8 194,16 V32 C194,40 176,40 176,32 V16 C176,8 172,4 164,4 H120 C112,4 110,8 110,12 V18 C110,24 98,24 98,18 V12 C98,8 92,4 84,4 H46 C38,4 36,8 36,14 V26 C36,34 20,34 20,26 V14 C20,8 12,4 0,4 Z"/>
          </svg>
        </div>
        <div class="target">TARGET 11.11</div>

    <div class="jama" id="jama"><div class="toasts" id="toasts"></div></div>

  <aside class="receipt-wrap">
    <div class="receipt">
      <h2>11.11 CHALLENGE</h2>
      <div class="sub">― 記録レシート ―</div>

      <div class="row big"><span>挑戦回数</span><b id="tries">0</b></div>
      <div class="row big"><span>ぴったり</span><b id="perfects">0</b></div>

      <div class="rh">BEST / 最小誤差</div>
      <div class="row"><span>ふつう</span><b id="bestNormal">--</b></div>
      <div class="row"><span>鬼</span><b id="bestOni">--</b></div>

      <div class="rh">HISTORY / 最近の記録</div>

</div>

<script>
  const TARGET_CS = 1111; // 11.11秒（センチ秒）
  const MODES = {
    normal: { name: 'ふつう', hideAt: 3, desc: '3秒たつとチョコがタイムを隠す' },
    oni:    { name: '鬼',     hideAt: 0, desc: 'GO! の瞬間からチョコで何も見えない' },
  };
  const JAMA_LEVELS = [
    { name: 'なし', min: 0, max: 0 },
    { name: 'あり', min: 900, max: 2000 },
    { name: '地獄', min: 350, max: 900 },
  ];
  // bg/fg: スタンプの色
  const RANKS = [
    { max: 0,        g: 'P', label: 'PERFECT!!', bg: 'var(--gold)',  fg: 'var(--ink)' },
    { max: 5,        g: 'S', label: '神業',      bg: 'var(--ink)',   fg: 'var(--gold)' },
    { max: 15,       g: 'A', label: 'すごい！',  bg: 'var(--cream)', fg: 'var(--red)' },
    { max: 50,       g: 'B', label: 'いい感じ',  bg: 'var(--cream)', fg: 'var(--choco)' },
    { max: 100,      g: 'C', label: 'おしい…',   bg: 'var(--cream-d)', fg: 'var(--choco)' },
    { max: Infinity, g: 'D', label: 'ポキッ…',   bg: 'var(--red-d)', fg: 'var(--cream)' },
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), center = $('center'), timeEl = $('time'), btn = $('btn'), btnLabel = $('btnLabel');
  const statusEl = $('status'), resultEl = $('result'), shareBtn = $('share'), cue = $('cue'), cover = $('cover');
  const jamaEl = $('jama'), toastsEl = $('toasts');
  const digits = timeEl.querySelectorAll('.d');
  const sticks = document.querySelectorAll('.stick');
  const chocos = document.querySelectorAll('.choco');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- 保存 ----------
  const KEY = 'pocky1111';
  function load() {
    const d = { best: {}, tries: 0, perfects: 0, history: [], mode: 'normal', jama: 1, sound: true };
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s) {
        Object.assign(d, s);
        if (typeof s.best !== 'object' || s.best === null) d.best = {};
        if (!MODES[d.mode]) d.mode = 'normal';
        if (!JAMA_LEVELS[d.jama]) d.jama = 1;
        d.history = (d.history || []).filter(h => h.g);
      }
    } catch {}
    return d;
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  let data = load();

  // ---------- サウンド（WebAudioで合成） ----------
  let ac = null, noiseBuf = null;
  function audio() {
    if (!data.sound) return null;
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      } catch { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, { type = 'sine', gain = .18, at = 0, to } = {}) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, { gain = .2, at = 0, freq = 3000, q = .8, type = 'bandpass' } = {}) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + at, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  }
  function say(text, opt = {}) {
    if (!data.sound || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = opt.rate || 1.15; u.pitch = opt.pitch || 1; u.volume = .9;
      speechSynthesis.speak(u);
    } catch {}
  }
  const sfx = {
    ready: () => tone(523, .12, { type: 'triangle' }),
    go:    () => { tone(1046, .25, { type: 'triangle', gain: .22 }); noise(.12, { freq: 6000, gain: .08 }); },
    stop:  () => { noise(.05, { freq: 2500, gain: .3 }); tone(220, .08, { type: 'square', gain: .08 }); },
    roll:  (dur) => { for (let t = 0; t < dur; t += .045) noise(.04, { at: t, freq: 900, q: 1.5, gain: .05 + .15 * (t / dur) }); },
    tick:  () => tone(1400, .04, { type: 'square', gain: .05 }),
    crash: () => noise(1.2, { freq: 7000, type: 'highpass', gain: .18 }),
    perfect: () => {
      [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .5, { type: 'triangle', at: i * .09, gain: .16 }));
      [1046, 1318, 1568].forEach(f => tone(f, 1.4, { type: 'sine', at: .5, gain: .1 }));
      sfx.crash();
    },
    good: () => { tone(880, .3, { type: 'triangle' }); tone(1318, .5, { type: 'triangle', at: .1 }); },
    meh:  () => tone(660, .35, { type: 'triangle', gain: .14 }),
    bad:  () => tone(330, .5, { type: 'sawtooth', gain: .08, to: 160 }),
    snap: () => { noise(.06, { freq: 4500, q: 3, gain: .5 }); tone(1800, .05, { type: 'square', gain: .07, to: 900 }); },
    flying: () => tone(200, .3, { type: 'square', gain: .1, to: 120 }),
    pour:  () => { tone(180, .35, { type: 'sine', gain: .2, to: 70 }); noise(.3, { freq: 400, q: 1, gain: .12 }); },
    lift:  () => tone(300, .25, { type: 'sine', gain: .12, to: 900 }),
    // お邪魔用
    notify: () => { tone(988, .12, { type: 'sine', gain: .14 }); tone(1319, .2, { type: 'sine', gain: .14, at: .1 }); },
    swoosh: () => noise(.5, { freq: 1200, q: .6, gain: .12 }),
    thud:   () => { tone(90, .3, { type: 'sine', gain: .3, to: 50 }); noise(.08, { freq: 300, gain: .2 }); },
    clock:  () => { noise(.025, { freq: 5000, q: 6, gain: .35 }); },
    off:    () => tone(140, .4, { type: 'sawtooth', gain: .07, to: 40 }),
  };

  // ---------- 表示ヘルパー ----------
  function setDigits(cs) {
    const s = (cs / 100).toFixed(2).padStart(5, '0');
    digits[0].textContent = s[0]; digits[1].textContent = s[1];
    digits[2].textContent = s[3]; digits[3].textContent = s[4];
  }
  function setSticks(cs, animate) {
    const half = TARGET_CS / 2;
    const p1 = Math.min(cs / half, 1), p2 = Math.min(Math.max((cs - half) / half, 0), 1);
    sticks.forEach(s => s.classList.toggle('anim', !!animate));
    chocos[0].style.height = (22 + p1 * 78) + '%';
    chocos[1].style.height = (22 + p2 * 78) + '%';
  }
  function resetSticks() {
    sticks.forEach(s => s.classList.remove('gold', 'snapped', 'wobble'));
    document.querySelectorAll('.piece, .pokit').forEach(e => e.remove());
    setSticks(0);
  }
  function showCue(text, small) {
    cue.textContent = text;
    cue.classList.toggle('small', !!small);
    cue.classList.remove('show'); void cue.offsetWidth; cue.classList.add('show');
  }
  function bump(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function spawn(cls, html, parent = jamaEl, life = 2000) {
    const el = document.createElement('div');
    el.className = cls; if (html !== undefined) el.innerHTML = html;
    parent.appendChild(el);
    setTimeout(() => el.remove(), life);
    return el;
  }
  function setLabel(t) { btnLabel.textContent = t; }

  // ---------- お邪魔 ----------
  // 隠れている間だけ、ランダムな間隔で発動。どれも本当の経過時間とは無関係。
  const TOASTS = [
    ['💬', '#3ac569', 'LINE', 'お母さん', '今日の夜ごはんポッキーでいい？'],
    ['📅', '#e5533d', 'カレンダー', 'リマインダー', '11:11 になりました'],
    ['⏱', '#555', 'システム', '時計.app', '時刻の同期に失敗しました（残り 4.27 秒）'],
    ['✉️', '#3b7be0', 'メール', 'ポッキー部長', '至急：いま何秒か教えてください'],
    ['🔋', '#f0a400', 'バッテリー', '残量 11%', 'あと 1.11 秒で電源が切れます'],
    ['💬', '#3ac569', 'LINE', '友だち', 'いま 8 秒くらいじゃない？'],
    ['🔥', '#000', 'X', 'トレンド', '#いま何秒 がトレンド入り'],
    ['🍫', '#7a3e27', 'お知らせ', 'チョコ工場', 'チョコの流出が止まりません'],
    ['📞', '#3ac569', '着信', '知らない番号', 'もしもし、9 秒経ちましたよ'],
    ['⚠️', '#e5533d', '警告', 'セキュリティ', '体内時計がハッキングされています'],
  ];
  const LIES = ['今だ！', 'まだ！', 'あと3秒！', 'STOP!?', 'もう過ぎた？', '11.11!!', 'はやく！', 'おちついて', '押すな！'];
  const COUNTS = ['いーち', 'にーい', 'さーん', 'しーい', 'ごーお', 'ろーく', 'なーな', 'はーち', 'きゅーう', 'じゅーう', 'じゅういち'];
  const COUNTS_SAY = ['いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう', 'じゅう', 'じゅういち'];

  const JAMA = {
    fakeTime() {
      const fake = Math.random() < .3 ? pick(['11.10', '11.12', '10.99', '11.11', '1.11', '111.1']) : rand(1, 14).toFixed(2);
      const el = spawn('j-num', fake, jamaEl, 1400);
      el.style.left = rand(4, 70) + '%'; el.style.top = rand(8, 70) + '%';
      el.style.fontSize = rand(48, 150) + 'px'; el.style.rotate = rand(-16, 16) + 'deg';
      sfx.tick();
    },
    toast() {
      const [ic, col, app, from, body] = pick(TOASTS);
      const el = spawn('toast', `<div class="ic" style="--ic:${col}">${ic}</div><div class="hd"><span>${app} ・ ${from}</span><span>今</span></div><div class="bd">${body}</div>`, toastsEl, 2900);
      sfx.notify();
      if (toastsEl.children.length > 3) toastsEl.firstElementChild.remove();
    },
    cat() {
      if (jamaEl.querySelector('.j-cat')) return JAMA.lie();
      const el = spawn('j-cat' + (Math.random() < .5 ? ' rev' : ''), `<span>${pick(['🐈', '🐈‍⬛', '🐕', '🐧'])}</span>`, jamaEl, 3500);
      el.style.animationDuration = rand(2.4, 4) + 's';
      say(pick(['にゃー', 'にゃーん', 'わん']), { pitch: 1.6 });
    },
    flyby() {
      const n = Math.random() < .4 ? 3 : 1;
      for (let i = 0; i < n; i++) {
        const el = spawn('j-fly', '', jamaEl, 1500);
        el.style.top = rand(0, 70) + '%';
        el.style.setProperty('--dy', rand(-200, 200) + 'px');
        el.style.setProperty('--spin', rand(540, 1440) * (Math.random() < .5 ? -1 : 1) + 'deg');
        el.style.animationDelay = i * .12 + 's';
      }
      sfx.swoosh();
    },
    fakeClock() {
      // わざとズレたテンポで時計の音を鳴らす
      const interval = Math.random() < .5 ? rand(.5, .8) : rand(1.25, 1.6);
      const n = Math.floor(rand(3, 6));
      for (let i = 0; i < n; i++) {
        jamaTimers.push(setTimeout(() => {
          if (!jamaActive) return;
          sfx.clock();
          const el = spawn('j-tick', i % 2 ? 'タク' : 'チク', jamaEl, 600);
          el.style.left = rand(10, 85) + '%'; el.style.top = rand(10, 80) + '%';
        }, i * interval * 1000));
      }
    },
    lie() {
      const t = pick(LIES);
      spawn('j-lie', t, jamaEl, 1000);
      sfx.thud();
      if (Math.random() < .4) say(t.replace(/[!！?？]/g, ''), { rate: 1.3 });
      bump(stage, 'shake');
    },
    count() {
      const i = Math.floor(Math.random() * COUNTS.length);
      const el = spawn('j-bubble', COUNTS[i], jamaEl, 1300);
      el.style.left = rand(8, 70) + '%'; el.style.top = rand(10, 60) + '%';
      say(COUNTS_SAY[i]);
    },
    warp() {
      const c = pick(['j-tilt', 'j-zoom', 'j-blur', 'j-flip']);
      center.classList.add(c);
      jamaTimers.push(setTimeout(() => center.classList.remove(c), rand(600, 1100)));
    },
    blackout() {
      if (stage.querySelector('.blackout-veil')) return;
      stage.classList.add('blackout');
      spawn('blackout-veil', '停電中…', stage, 950);
      sfx.off();
      jamaTimers.push(setTimeout(() => stage.classList.remove('blackout'), 900));
    },
    fakeStop() {
      // 止めた音だけ鳴らす
      sfx.stop();
      showCue(pick(['STOP?', 'ピッ']), true);
    },
  };
  const JAMA_KEYS = Object.keys(JAMA);
  let jamaActive = false, jamaTimer = 0, jamaTimers = [], lastJama = '';

  function startJama() {
    if (!data.jama) return;
    jamaActive = true;
    scheduleJama(rand(300, 900));
  }
  function scheduleJama(delay) {
    jamaTimer = setTimeout(() => {
      if (!jamaActive) return;
      let k; do { k = pick(JAMA_KEYS); } while (k === lastJama);
      lastJama = k;
      JAMA[k]();
      if (data.jama === 2 && Math.random() < .35) JAMA[pick(['fakeTime', 'toast', 'count', 'flyby'])]();
      const lv = JAMA_LEVELS[data.jama];
      scheduleJama(rand(lv.min, lv.max));
    }, delay);
  }
  function stopJama() {
    jamaActive = false;
    clearTimeout(jamaTimer);
    jamaTimers.forEach(clearTimeout); jamaTimers = [];
    jamaEl.querySelectorAll(':scope > :not(.toasts)').forEach(e => e.remove());
    toastsEl.innerHTML = '';
    stage.querySelectorAll('.blackout-veil').forEach(e => e.remove());
    stage.classList.remove('blackout');
    center.classList.remove('j-tilt', 'j-zoom', 'j-blur', 'j-flip');
    try { speechSynthesis.cancel(); } catch {}
  }

  // ---------- ゲーム状態 ----------
  // idle → ready → running → reveal → done
  let state = 'idle', startAt = 0, raf = 0, readyTimer = 0, lastResult = null, masked = false;

  function setMode(m) {
    data.mode = m; save();
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    renderDesc();
  }
  function setJama(j) {
    data.jama = j; save();
    document.querySelectorAll('[data-jama]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.jama === j));
    renderDesc();
  }
  function renderDesc() {
    $('modeDesc').textContent = `${MODES[data.mode].desc} ・ お邪魔${JAMA_LEVELS[data.jama].name} ・ ENTER / クリックでもOK`;
  }

  function startReady() {
    state = 'ready';
    resetSticks(); stopJama();
    resultEl.innerHTML = '';
    timeEl.className = 'time'; setDigits(0);
    masked = false; cover.className = 'cover';
    btn.classList.add('running'); setLabel('ストップ');
    statusEl.textContent = 'WAIT FOR GO…';
    lockCtl(true);
    showCue('READY'); sfx.ready();
    readyTimer = setTimeout(go, rand(900, 1700)); // 合図のタイミングをばらす
  }

  function go() {
    state = 'running';
    startAt = performance.now();
    showCue('GO!'); sfx.go();
    statusEl.textContent = 'STOP AT 11.11';
    sticks.forEach(s => s.classList.add('wobble'));
    raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    const cs = Math.max(0, Math.floor((now - startAt) / 10));
    if (cs >= MODES[data.mode].hideAt * 100) {
      if (!masked) {
        // チョコの下の数字は止めておく（すき間から覗けないように）
        masked = true;
        cover.className = 'cover on';
        sticks.forEach(s => s.classList.remove('wobble')); // 揺れのリズムで数えられないように
        sfx.pour();
        statusEl.textContent = 'COUNT IN YOUR HEAD';
        startJama();
      }
    } else {
      setDigits(cs);
      setSticks(cs);
    }
    raf = requestAnimationFrame(tick);
  }

  function flying() {
    clearTimeout(readyTimer);
    state = 'done';
    sfx.flying();
    bump(stage, 'shake');
    showCue('フライング', true);
    statusEl.textContent = 'WAIT FOR GO!';
    btn.classList.remove('running'); setLabel('もう一回');
    lockCtl(false);
  }

  function stop(at) {
    cancelAnimationFrame(raf);
    const cs = Math.max(0, Math.floor((at - startAt) / 10));
    state = 'reveal';
    stopJama();
    sfx.stop();
    sticks.forEach(s => s.classList.remove('wobble'));
    btn.classList.remove('running'); btn.classList.add('wait'); setLabel('判定中…');
    statusEl.textContent = 'DRUM ROLL…';
    reveal(cs);
  }

  // ドラムロールしながら1桁ずつ確定させる
  function reveal(cs) {
    if (masked) { cover.className = 'cover off'; sfx.lift(); }
    const final = (cs / 100).toFixed(2).padStart(5, '0');
    const finalDigits = [final[0], final[1], final[3], final[4]];
    const ROLL = reduced ? .2 : 1.6;
    const settleAt = [.45, .45, .75, 1].map(x => x * ROLL * 1000);
    const settled = [false, false, false, false];
    sfx.roll(ROLL);
    setSticks(cs, true);

    const t0 = performance.now();
    const iv = setInterval(() => {
      const el = performance.now() - t0;
      digits.forEach((d, i) => {
        if (settled[i]) return;
        if (el >= settleAt[i]) {
          settled[i] = true;
          d.textContent = finalDigits[i];
          d.classList.remove('rolling'); bump(d, 'settle');
          if (i >= 1) sfx.tick();
        } else {
          d.textContent = Math.floor(Math.random() * 10);
          d.classList.add('rolling');
        }
      });
      if (settled.every(Boolean)) {
        clearInterval(iv);
        setTimeout(() => judge(cs), 200);
      }
    }, 50);
  }

  function judge(cs) {
    state = 'done';
    const diff = Math.abs(cs - TARGET_CS);
    const rank = RANKS.find(r => diff <= r.max);
    const shown = (cs / 100).toFixed(2);
    const over = cs > TARGET_CS;
    const prevBest = data.best[data.mode];
    const isBest = prevBest === undefined || diff < prevBest;

    let msg;
    if (diff === 0) msg = '完璧な 11.11 秒。あなたがポッキーの日の主役です';
    else if (diff <= 5) msg = over ? 'ほんの一瞬だけ遅かった…！' : 'ほんの一瞬だけ早かった…！';
    else if (diff <= 50) msg = over ? 'ちょっと遅め。もう少し早く！' : 'ちょっと早め。もう少しガマン！';
    else msg = over ? '待ちすぎてポッキーが折れちゃった' : '焦りすぎてポッキーが折れちゃった';

    resultEl.innerHTML = `
      <div class="stamp ${rank.g === 'P' ? 'small' : ''}" style="--bg:${rank.bg};--fg:${rank.fg}">${rank.g === 'P' ? '11.11' : rank.g}</div>
      <div class="txt">
        <div class="label">${rank.label}${isBest ? '<span class="newbest">NEW BEST</span>' : ''}</div>
        <div class="diff">誤差 ${diff === 0 ? '±0.00' : (over ? '+' : '−') + (diff / 100).toFixed(2)} 秒 ・ ${MODES[data.mode].name} ・ お邪魔${JAMA_LEVELS[data.jama].name}</div>
        <div class="msg">${msg}</div>
      </div>`;

    if (rank.g === 'P') {
      timeEl.classList.add('perfect');
      sticks.forEach(s => s.classList.add('gold'));
      sfx.perfect(); flash(); rain(120);
    } else if (rank.g === 'S') {
      sticks.forEach(s => s.classList.add('gold'));
      sfx.good(); rain(45);
    } else if (rank.g === 'A') {
      sfx.good(); rain(18);
    } else if (rank.g === 'D') {
      snap(cs > TARGET_CS / 2 ? 1 : 0);
      sfx.bad();
    } else {
      sfx.meh();
    }

    data.tries++;
    if (diff === 0) data.perfects++;
    if (isBest) data.best[data.mode] = diff;
    data.history.unshift({ n: data.tries, t: shown, diff, g: rank.g, m: data.mode, j: data.jama });
    data.history = data.history.slice(0, 12);
    save();
    renderStats();

    lastResult = { shown, diff, g: rank.g, mode: data.mode, jama: data.jama };
    shareBtn.disabled = false;
    statusEl.textContent = diff === 0 ? '★ ★ ★ PERFECT ★ ★ ★' : 'PRESS SPACE TO RETRY';
    btn.classList.remove('wait'); setLabel('もう一回');
    lockCtl(false);
  }

  function snap(i) {
    const s = sticks[i];
    setTimeout(() => {
      s.classList.add('snapped');
      const p = document.createElement('div'); p.className = 'piece'; s.appendChild(p);
      const t = document.createElement('div'); t.className = 'pokit'; t.textContent = 'ポキッ！';
      if (i === 0) { t.style.left = 'auto'; t.style.right = '120%'; }
      s.appendChild(t);
      sfx.snap(); bump(stage, 'shake');
    }, 250);
  }

  function flash() {
    if (reduced) return;
    const f = document.createElement('div'); f.className = 'flash';
    document.body.appendChild(f); setTimeout(() => f.remove(), 800);
  }

  function rain(n) {
    if (reduced) return;
    const colors = ['var(--choco)', '#f49ab0', '#7cc28a', '#ffffff', '#c9a0dc', 'var(--gold)'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'fall';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.setProperty('--cc', colors[i % colors.length]);
      c.style.setProperty('--dx', rand(-80, 80) + 'px');
      c.style.setProperty('--rot', rand(-500, 500) + 'deg');
      c.style.animationDuration = rand(1.8, 3.8) + 's';
      c.style.animationDelay = Math.random() * .7 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function lockCtl(lock) { document.querySelectorAll('[data-mode], [data-jama]').forEach(b => b.disabled = lock); }

  function renderStats() {
    const fmt = v => v === undefined ? '--' : (v / 100).toFixed(2) + 's';
    $('bestNormal').textContent = fmt(data.best.normal);
    $('bestOni').textContent = fmt(data.best.oni);
    $('tries').textContent = data.tries;
    $('perfects').textContent = data.perfects;
    $('history').innerHTML = data.history.length
      ? data.history.map(h => {
          const r = RANKS.find(r => r.g === h.g);
          const no = h.n ? String(h.n).padStart(3, '0') : '---';
          const tag = (MODES[h.m] ? MODES[h.m].name : '') + (h.j === 2 ? '・地獄' : h.j === 0 ? '・素' : '');
          return `<li><span class="no">${no}</span><span class="t">${h.t}s<small>${tag}</small></span><span class="g" style="--bg:${r.bg};--fg:${r.fg}">${h.g}</span><span class="e">±${(h.diff / 100).toFixed(2)}</span></li>`;
        }).join('')
      : '<li class="empty">まだ記録がありません</li>';
  }

  // ---------- 入力 ----------
  function action(at) {
    if (state === 'idle' || state === 'done') startReady();
    else if (state === 'ready') flying();
    else if (state === 'running') stop(at);
  }
  function pressFx() { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 110); }

  // pointerdown で押した瞬間の時刻を使う（クリックより反応が速い）
  btn.addEventListener('pointerdown', e => { if (e.button === 0) action(e.timeStamp); });
  btn.addEventListener('click', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
      if (e.target.closest && e.target.closest('.top, .receipt')) return;
      e.preventDefault();
      pressFx();
      action(e.timeStamp);
    } else if (e.code === 'KeyF' && !e.repeat) {
      toggleFs();
    }
  });

  function toggleFs() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch {}
  }
  $('fsBtn').addEventListener('click', e => { toggleFs(); e.currentTarget.blur(); });

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); b.blur(); }));
  document.querySelectorAll('[data-jama]').forEach(b => b.addEventListener('click', () => { setJama(+b.dataset.jama); b.blur(); }));

  const soundBtn = $('sound');
  const renderSound = () => soundBtn.textContent = data.sound ? 'SOUND ON' : 'SOUND OFF';
  soundBtn.addEventListener('click', () => { data.sound = !data.sound; save(); renderSound(); soundBtn.blur(); });

  shareBtn.addEventListener('click', () => {
    if (!lastResult) return;
    const r = lastResult;
    const head = r.g === 'P' ? '【PERFECT】ぴったり11.11秒で止めた！' : `11.11秒チャレンジ ランク${r.g}`;
    const text = `${head}\n記録 ${r.shown} 秒（誤差 ${(r.diff / 100).toFixed(2)} 秒）／${MODES[r.mode].name}・お邪魔${JAMA_LEVELS[r.jama].name}\n#ポッキーの日 #1111`;
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(location.href), '_blank');
  });

  setMode(data.mode);
  setJama(data.jama);
  renderSound();
  renderStats();
  resetSticks();
</script>
</body>
</html>
