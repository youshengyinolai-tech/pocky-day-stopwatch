<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11.11秒チャレンジ</title>
<meta name="description" content="11月11日はポッキーの日！ストップウォッチをぴったり11.11秒で止められるか挑戦しよう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4ec;
    --card: #ffffff;
    --ink: #3b1f14;
    --muted: #8a6a5c;
    --choco: #5a2e1c;
    --biscuit: #e9b872;
    --accent: #d93a4a;
    --ring: rgba(90, 46, 28, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d120d; --card: #2a1a13; --ink: #fbe9dd; --muted: #c4a493;
      --choco: #7a4128; --biscuit: #e2ae66; --accent: #ff6170; --ring: rgba(255,255,255,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  header { text-align: center; margin-bottom: 16px; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .08em;
    color: var(--accent); border: 2px solid var(--accent); border-radius: 999px; padding: 2px 12px;
  }
  h1 { font-size: clamp(26px, 7vw, 40px); margin: 10px 0 4px; font-weight: 800; }
  h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 15px; }

  .card {
    width: 100%; max-width: 460px; background: var(--card); border-radius: 28px;
    box-shadow: 0 0 0 1px var(--ring), 0 18px 40px -20px rgba(90,46,28,.35);
    padding: 28px 20px 24px; text-align: center;
  }

  /* stick */
  .stick-wrap { height: 230px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 8px; }
  .stick { position: relative; width: 26px; height: 220px; }
  .stick .base, .stick .choco { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 13px; }
  .stick .base { height: 100%; background: var(--ring); }
  .stick .choco {
    height: 0%;
    background: linear-gradient(90deg, var(--choco), color-mix(in srgb, var(--choco) 70%, #fff) 45%, var(--choco));
  }
  .stick .grip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
    background: repeating-linear-gradient(0deg, var(--biscuit) 0 8px, color-mix(in srgb, var(--biscuit) 80%, #000) 8px 9px);
    border-radius: 0 0 13px 13px; z-index: 1;
  }
  .sticks { display: flex; gap: 22px; }

  .time {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(56px, 18vw, 84px); line-height: 1; margin: 8px 0 4px;
    font-variant-numeric: tabular-nums; transition: opacity .4s;
  }
  .time.hidden { opacity: 0; }
  .target { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  .btn {
    width: 100%; border: 0; border-radius: 18px; padding: 18px; font: inherit;
    font-size: 22px; font-weight: 800; cursor: pointer; color: #fff; background: var(--accent);
    box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 65%, #000);
    transition: transform .06s, box-shadow .06s; touch-action: manipulation;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 65%, #000); }
  .btn.stop { background: var(--choco); box-shadow: 0 6px 0 color-mix(in srgb, var(--choco) 60%, #000); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

  .opts { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .opts label {
    font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    box-shadow: inset 0 0 0 1.5px var(--ring); color: var(--muted);
  }
  .opts input { display: none; }
  .opts input:checked + span { color: var(--ink); }
  .opts label:has(input:checked) { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }

  .result { min-height: 92px; margin-top: 18px; }
  .result .diff { font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--muted); }
  .result .rank { font-size: 24px; font-weight: 800; margin: 4px 0; }
  .result .rank.perfect { color: var(--accent); animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .share { display: none; margin: 10px auto 0; background: none; border: 0; color: var(--accent); font: inherit; font-weight: 800; cursor: pointer; text-decoration: underline; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px 4px; }
  .stat b { display: block; font-family: "JetBrains Mono", monospace; font-size: 17px; }
  .stat small { color: var(--muted); font-size: 11px; }

  .history { width: 100%; max-width: 460px; margin-top: 20px; }
  .history h2 { font-size: 15px; color: var(--muted); margin: 0 0 8px 4px; }
  .history ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .history li {
    display: flex; justify-content: space-between; background: var(--card); border-radius: 12px;
    padding: 10px 14px; box-shadow: 0 0 0 1px var(--ring); font-family: "JetBrains Mono", monospace; font-size: 15px;
  }
  .history li span:last-child { color: var(--muted); }

  footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }

  .confetti { position: fixed; top: -20px; width: 8px; height: 40px; border-radius: 4px; pointer-events: none; z-index: 10; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
  <header>
    <div class="badge">11.11 ポッキーの日</div>
    <h1><span>11.11</span>秒で止めろ！</h1>
    <p>ぴったり 11.11 秒でストップできるかな？</p>
  </header>

  <main class="card">
    <div class="opts" role="radiogroup" aria-label="難易度">
      <label><input type="radio" name="mode" value="easy" checked><span>かんたん（ずっと表示）</span></label>
      <label><input type="radio" name="mode" value="hard"><span>むずかしい（3秒で消える）</span></label>
    </div>

    <div class="stick-wrap" aria-hidden="true">
      <div class="sticks">
        <div class="stick"><div class="base"></div><div class="choco"></div><div class="grip"></div></div>
        <div class="stick"><div class="base"></div><div class="choco"></div><div class="grip"></div></div>
      </div>
    </div>

    <div class="time" id="time">0.00</div>
    <div class="target">目標 11.11 秒</div>

    <button class="btn" id="btn">スタート</button>
    <div class="hint">スペースキー / Enter でも操作できます</div>

    <div class="result" id="result" aria-live="polite"></div>
    <button class="share" id="share">結果を X でシェア</button>

    <div class="stats">
      <div class="stat"><b id="best">--</b><small>ベスト誤差</small></div>
      <div class="stat"><b id="tries">0</b><small>挑戦回数</small></div>
      <div class="stat"><b id="perfects">0</b><small>ぴったり回数</small></div>
    </div>
  </main>

  <section class="history">
    <h2>最近の記録</h2>
    <ol id="history"></ol>
  </section>

  <footer>非公式ファンメイドのミニゲームです。</footer>

<script>
  const TARGET = 11.11;
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), btn = $('btn'), resultEl = $('result'), shareBtn = $('share');
  const chocos = document.querySelectorAll('.choco');

  let running = false, start = 0, raf = 0, lastResult = null;

  const store = {
    get() { try { return JSON.parse(localStorage.getItem('pocky1111')) || { best: null, tries: 0, perfects: 0, history: [] }; } catch { return { best: null, tries: 0, perfects: 0, history: [] }; } },
    set(v) { try { localStorage.setItem('pocky1111', JSON.stringify(v)); } catch {} }
  };
  let data = store.get();

  const mode = () => document.querySelector('input[name=mode]:checked').value;

  function setSticks(t) {
    // 2本で 11.11 秒ぶん。1本目 0〜5.555秒、2本目 5.555〜11.11秒でチョコが満ちる
    const half = TARGET / 2;
    const p1 = Math.min(t / half, 1), p2 = Math.min(Math.max((t - half) / half, 0), 1);
    chocos[0].style.height = (22 + p1 * 78) + '%';
    chocos[1].style.height = (22 + p2 * 78) + '%';
  }

  function tick() {
    const t = (performance.now() - start) / 1000;
    timeEl.textContent = t.toFixed(2);
    if (mode() === 'hard') timeEl.classList.toggle('hidden', t > 3);
    setSticks(mode() === 'hard' && t > 3 ? 0 : t);
    raf = requestAnimationFrame(tick);
  }

  function rankFor(diff) {
    if (diff === 0) return ['🎉 PERFECT！ 11.11！', true];
    if (diff <= 0.03) return ['神ってる！ほぼぴったり', false];
    if (diff <= 0.1) return ['すごい！あと少し', false];
    if (diff <= 0.3) return ['いい感じ！', false];
    if (diff <= 1) return ['おしい…', false];
    return ['もう一回チャレンジ！', false];
  }

  function toggle() {
    if (!running) {
      running = true;
      start = performance.now();
      resultEl.innerHTML = '';
      shareBtn.style.display = 'none';
      timeEl.classList.remove('hidden');
      btn.textContent = 'ストップ';
      btn.classList.add('stop');
      raf = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(raf);
      running = false;
      const t = Math.floor((performance.now() - start) / 10) / 100;
      const shown = t.toFixed(2);
      timeEl.textContent = shown;
      timeEl.classList.remove('hidden');
      setSticks(t);
      btn.textContent = 'もう一回';
      btn.classList.remove('stop');

      const diff = Math.round(Math.abs(t - TARGET) * 100) / 100;
      const [rank, perfect] = rankFor(diff);
      const sign = t >= TARGET ? '+' : '−';
      resultEl.innerHTML = `<div class="diff">誤差 ${diff === 0 ? '±0.00' : sign + diff.toFixed(2)} 秒</div><div class="rank ${perfect ? 'perfect' : ''}">${rank}</div>`;

      data.tries++;
      if (perfect) { data.perfects++; confetti(); }
      if (data.best === null || diff < data.best) data.best = diff;
      data.history.unshift({ t: shown, diff: diff.toFixed(2) });
      data.history = data.history.slice(0, 5);
      store.set(data);
      render();

      lastResult = { shown, diff, mode: mode() };
      shareBtn.style.display = 'block';
    }
  }

  function render() {
    $('best').textContent = data.best === null ? '--' : data.best.toFixed(2);
    $('tries').textContent = data.tries;
    $('perfects').textContent = data.perfects;
    $('history').innerHTML = data.history.length
      ? data.history.map(h => `<li><span>${h.t} 秒</span><span>誤差 ${h.diff}</span></li>`).join('')
      : '<li><span>まだ記録がありません</span><span></span></li>';
  }

  function confetti() {
    const colors = ['#5a2e1c', '#e9b872', '#d93a4a', '#f7a8b8'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.5 + Math.random() * 1.5 + 's';
      c.style.animationDelay = Math.random() * .4 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  btn.addEventListener('click', e => { if (e.detail !== 0) toggle(); }); // キーボード由来のclickは keydown 側で処理
  document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
      e.preventDefault();
      toggle();
    }
  });
  shareBtn.addEventListener('click', () => {
    if (!lastResult) return;
    const m = lastResult.mode === 'hard' ? '（むずかしいモード）' : '';
    const text = `11.11秒チャレンジ${m}で ${lastResult.shown} 秒！誤差 ${lastResult.diff.toFixed(2)} 秒 #ポッキーの日 #1111`;
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(location.href), '_blank');
  });

  setSticks(0);
  render();
</script>
</body>
</html>
